# ============================================================================
# Configuration des catégories — Bibliothèque BIBLIO
# ============================================================================
# Ce fichier définit l'arborescence et les mots-clés de classement.
# Pour ajouter un nouveau thème : ajouter une entrée sous la bonne catégorie.
# Pour enrichir un thème existant : ajouter des mots-clés à la liste.
#
# Format :
#   chemin: le chemin relatif du dossier dans BIBLIO/
#   mots_cles: liste de mots/expressions (insensible à la casse)
#   priorite: plus le chiffre est bas, plus la catégorie est prioritaire
#             (utile quand un livre matche plusieurs catégories)
# ============================================================================

# ──────────────────────────────────────────────────────────────────────────────
