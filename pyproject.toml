[project]
name = "klodo"
version = "1.0.0-dev"
description = "Outil unifié de gestion de bibliothèque PDF — renommage, classification, raffinement"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pdf2image>=1.16.0",
    "pillow>=9.0.0",
    "pypdf>=3.0.0",
    "pdfplumber>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "duckdb>=1.0.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/auto/*.py" = ["E402"]
"klodo.py" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
