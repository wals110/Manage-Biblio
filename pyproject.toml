[project]
name = "klodo"
version = "1.0.0-dev"
description = "Outil unifié de gestion de bibliothèque PDF — renommage, classification, raffinement"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pdf2image>=1.16.0",
    "pillow>=9.0.0",
    "pypdf>=3.0.0",
    "pdfplumber>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "duckdb>=1.0.0",
    "pyspellchecker>=0.9.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/auto/*.py" = ["E402"]
"klodo.py" = ["E402"]
# Pre-existing inline-statement style + dynamic imports — clean up later
"tests/functional/run_functional.py" = ["E701", "E702", "F841"]
"dashboard/app.py" = ["E701", "E702", "E402", "F841", "E741"]
# Notebook imports cells run after markdown cells
"notebooks/*.ipynb" = ["E402"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.6.0",
]
ml = [
    "transformers>=4.40.0,<5.0.0",
    "torch>=2.2.0",
    "sentencepiece>=0.2.0",
    "setfit>=1.1.0",
    "scikit-learn>=1.4.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.0",
]
