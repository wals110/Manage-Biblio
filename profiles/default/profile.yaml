# ═══════════════════════════════════════════════════════════════════════════
# Profil : default
# Description : Bibliothèque principale (~19 000 PDFs, 9 sections)
# ═══════════════════════════════════════════════════════════════════════════

name: default
description: "Bibliothèque principale"
target: /chemin/vers/biblio               # À adapter à votre installation
inbox: /chemin/vers/biblio/_INBOX         # À adapter à votre installation
fallback: _A-TRIER                      # Sous-dossier de target pour les non-classifiés

# ── LLM Vision ──
llm:
  provider: siliconflow          # siliconflow | ollama
  model: Qwen/Qwen3-VL-32B-Instruct
  endpoint: https://api.siliconflow.com/v1/chat/completions
  # Pour Ollama (futur) :
  # provider: ollama
  # model: qwen2.5-vl:7b
  # endpoint: http://localhost:11434/v1/chat/completions

# ── Paramètres par défaut ──
defaults:
  workers: 10
  delay: 0.2                     # Délai entre requêtes séquentielles (secondes)
  min_confidence: 0.5            # Seuil pour classification et renommage
  max_filename_length: 180
  pdf_timeout: 15
  cost_per_call: 0.00034         # Coût estimé par appel LLM ($/appel)
  max_api_errors: 10             # Arrêt après N erreurs API consécutives
  max_retries: 3                 # Tentatives par appel API
  # LLM Mapper — résolution intelligente des thèmes inconnus
  llm_mapper: true               # Activer/désactiver le mapper
  mapper_min_confidence: 0.6     # Confiance minimum pour accepter le mapping



