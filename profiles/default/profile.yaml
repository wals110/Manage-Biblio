# ═══════════════════════════════════════════════════════════════════════════
# Profil : default
# Description : Bibliothèque principale (~19 000 PDFs, 9 sections)
# ═══════════════════════════════════════════════════════════════════════════

name: default
description: "Bibliothèque principale"
target: /Volumes/ExtSSD/BIBLIO
inbox: /Volumes/ExtSSD/BIBLIO/_A-TRIER

# ── LLM Vision ──
llm:
  provider: siliconflow          # siliconflow | ollama
  model: Qwen/Qwen3-VL-8B-Instruct
  endpoint: https://api.siliconflow.com/v1/chat/completions
  # Pour Ollama (futur) :
  # provider: ollama
  # model: qwen2.5-vl:7b
  # endpoint: http://localhost:11434/v1/chat/completions

# ── Paramètres par défaut ──
defaults:
  workers: 10
  min_confidence: 0.5
  max_filename_length: 180
  pdf_timeout: 15
  # LLM Mapper — résolution intelligente des thèmes inconnus
  llm_mapper: true               # Activer/désactiver le mapper
  mapper_min_confidence: 0.6     # Confiance minimum pour accepter le mapping



