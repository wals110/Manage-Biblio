    checks:
    - id: T7.3a
      description: Tous les PDFs sont dans _INBOX après flatten complet
      command: find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' | wc -l |
        tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T7.3b
      description: Le nombre total de PDFs est préservé
      command: COUNT=$(find ${INBOX} -name '*.pdf' | wc -l | tr -d ' '); echo $COUNT;
        test $COUNT -gt 0
      assert:
        type: exit_code
