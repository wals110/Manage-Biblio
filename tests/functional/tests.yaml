      command: ${KLODO} init test-func-temp --target /tmp/biblio-test 2>&1
      assert:
        type: output_contains
        expected:
        - Profil
        - créé
      mode: auto
    - id: T5.2b
      description: Le profil contient les fichiers attendus
      command: ls ${PROFILES}/test-func-temp/ 2>&1
      assert:
        type: output_contains
        expected:
        - profile.yaml
        - tree.yaml
      mode: auto
    - id: T5.2c
      description: init sur un profil existant échoue proprement
      command: ${KLODO} init test-func-temp --target /tmp/biblio-test 2>&1; true
      assert:
        type: output_contains
        expected:
        - existe déjà
      mode: auto
  - id: T5.3
    github_issue: 112
    name: suggest — Suggestions de dossiers
    description: Vérifie la commande suggest
    provides:
    - suggest_works
    requires:
    - cli_works
    pre_run: []
    post_run: []
    setup: []
    checks:
    - id: T5.3a
      description: suggest sans suggestions affiche un message clair
      command: ${KLODO} suggest --profile ${PROF} 2>&1
      assert:
        type: output_contains
