- id: phase_9
  name: Reclassification et enrichissement
  priority: moyenne
  pre_run: []
  post_run: []
  series:
  - id: T9.1
    github_issue: 126
    name: Suggestions workflow complet
    description: Générer, reviewer et appliquer les suggestions de nouveaux dossiers
    provides:
    - suggestions_applied
    requires:
    - classify_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} -w 10 --execute --verbose
      2>&1
    checks:
    - id: T9.1a
      description: Suggestions mentionnées dans le résumé
      command: cat logs/.setup_output_T9.1.txt 2>/dev/null | grep -ciE 'suggestion|nouveau|inconnu'
        ; true
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T9.1b
      description: suggest liste les suggestions en attente
      command: ${KLODO} suggest --profile ${PROF} 2>&1
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T9.1c
      description: suggest --apply --execute crée les dossiers et reclassifie
      command: ${KLODO} suggest --profile ${PROF} --apply --execute 2>&1
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T9.1d
      description: Nouveaux dossiers créés et fichiers reclassifiés
      command: echo check
      assert:
        type: manual_check
        prompt: Les nouveaux dossiers ont-ils été créés dans l'arborescence et tree.yaml/theme_mapping.yaml
          mis à jour ?
      mode: manual_check
  - id: T9.2
    github_issue: 127
    name: Reclassify après enrichissement
    description: --reclassify re-mappe les thèmes sans appel LLM
    provides: []
    requires:
    - classify_execute
    - api_ready
    pre_run: []
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --reclassify 2>&1
    checks:
    - id: T9.2a
      description: Reclassify fonctionne sans appel LLM (pur YAML)
      command: cat logs/.setup_output_T9.2.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - Rapport
      mode: auto
    - id: T9.2b
      description: Des fichiers sont re-mappés vers de meilleurs dossiers
      command: echo check
      assert:
        type: manual_check
        prompt: Le reclassify a-t-il re-mappé des fichiers vers de meilleurs dossiers
          (vérifier le rapport) ?
      mode: manual_check
  - id: T9.3
    github_issue: 128
    name: Auto-apprentissage du LLM Mapper
    description: Les thèmes résolus par le LLM sont persistés dans theme_mapping.yaml
    provides: []
    requires:
    - classify_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - BEFORE=$(wc -l < ${PROFILES}/${PROF}/theme_mapping.yaml 2>/dev/null || echo
      0)
    - ${KLODO} classify -y --profile ${PROF} -w 10 --execute --verbose
      2>&1
    - AFTER=$(wc -l < ${PROFILES}/${PROF}/theme_mapping.yaml 2>/dev/null || echo 0)
    - echo "mapping_before=$BEFORE mapping_after=$AFTER"
    checks:
    - id: T9.3a
      description: theme_mapping.yaml a été enrichi
      command: wc -l < ${PROFILES}/${PROF}/theme_mapping.yaml | tr -d ' '
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T9.3b
      description: Résolution instantanée au prochain run (pas d'appel LLM)
      command: echo check
      assert:
        type: manual_check
        prompt: En relançant classify, les mêmes thèmes sont-ils résolus instantanément
          sans appel LLM ?
      mode: manual_check
- id: phase_10
  name: Benchmark et stabilité
  priority: basse
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  post_run: []
  series:
  - id: T10.1
    github_issue: 129
    name: Benchmark workers (1 vs 10)
    description: Compare les performances avec 1 worker vs 10 workers
    provides: []
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - T1=$(date +%s); ${KLODO} classify -y --profile ${PROF} -w
      1 --verbose 2>&1; T2=$(date +%s); echo $((T2-T1)) > ${LOGS}/.bench_1w.txt; true
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - T1=$(date +%s); ${KLODO} classify -y --profile ${PROF} -w
      10 --verbose 2>&1; T2=$(date +%s); echo $((T2-T1)) > ${LOGS}/.bench_10w.txt;
      true
    checks:
    - id: T10.1a
      description: 10 workers au moins 2x plus rapide que 1 worker
      command: 'W1=$(cat ${LOGS}/.bench_1w.txt 2>/dev/null || echo 1); W10=$(cat ${LOGS}/.bench_10w.txt
        2>/dev/null || echo 1); R=$((W1 / (W10 > 0 ? W10 : 1))); echo "ratio=${R}x
        (1w=${W1}s 10w=${W10}s)"; test $R -ge 2'
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T10.1b
      description: Temps 1 worker et 10 workers logués
      command: echo "1w=$(cat ${LOGS}/.bench_1w.txt)s 10w=$(cat ${LOGS}/.bench_10w.txt)s"
      assert:
        type: exit_code
        expected: 0
      mode: auto
  - id: T10.2
    github_issue: 130
    name: Benchmark par étape
    description: Mesure les performances de chaque étape du pipeline
    provides: []
    requires:
    - cli_works
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup: []
    checks:
    - id: T10.2a
      description: Renommage 500 fichiers (sans LLM) < 60 secondes
      command: ${KLODO} rename --profile ${PROF} 2>&1
      assert:
        type: duration_under
        seconds: 60
      mode: auto
    - id: T10.2b
      description: Classification 500 fichiers (10 workers) < 5 minutes
      command: ${KLODO} classify -y --profile ${PROF} -w 10 2>&1
      assert:
        type: duration_under
        seconds: 300
      mode: auto
    - id: T10.2c
      description: Pipeline complet 500 fichiers avec LLM < 15 minutes
      command: ${KLODO} process -y --profile ${PROF} --llm --pages 1 -w 10
        2>&1
      assert:
        type: duration_under
        seconds: 900
      mode: auto
  - id: T10.3
    github_issue: 131
    name: Stabilité réseau (erreurs API)
    description: Provoquer des erreurs réseau avec delay 0 et 20 workers
    provides: []
    requires:
    - classify_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --delay 0 -w 20 --verbose
      2>&1
    checks:
    - id: T10.3a
      description: Erreurs 429 retry avec backoff
      command: grep -ci 'retry\|backoff\|429' ${LOGS}/klodo.log 2>/dev/null; true
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T10.3b
      description: Erreurs 500 ne crashent pas le process
      command: R=$(ls -t ${LOGS}/rapport_classify_*.csv 2>/dev/null | head -1); grep
        -c erreur_api "$R" 2>/dev/null; true
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T10.3c
      description: Le traitement continue après les erreurs
      command: R=$(ls -t ${LOGS}/rapport_classify_*.csv 2>/dev/null | head -1); tail
        -n+2 "$R" | wc -l | tr -d ' '
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T10.3d
      description: Max erreurs consécutives arrête proprement
      command: cat logs/.setup_output_T10.3.txt 2>/dev/null | grep -ciE 'arrêt|stop|abort|max.*erreur|trop.*erreur'
        ; true
      assert:
        type: exit_code
        expected: 0
      mode: auto
  - id: T10.4
    github_issue: 132
    name: Stress test (volume complet)
    description: Pipeline sur les ~18000 fichiers
    timeout: 3600
    provides: []
    requires:
    - process_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1; true
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} -w 10 --execute --verbose 2>&1
    checks:
    - id: T10.4a
      description: Terminaison propre sur le volume complet
      command: cat logs/.setup_output_T10.4.txt 2>/dev/null | grep -c 'Pipeline terminé'
        ; true
      assert:
        type: output_equals
        expected: '1'
      mode: auto
    - id: T10.4b
      description: Taux de classification > 90%
      command: echo check
      assert:
        type: manual_check
        prompt: Le pourcentage de classification est-il > 90% dans le résumé ?
      mode: manual_check
    - id: T10.4c
      description: Temps raisonnable (< 1h sans LLM rename)
      command: echo ok
      assert:
        type: duration_under
        seconds: 3600
      mode: auto
    - id: T10.4d
      description: Pas de Traceback non catchée
      command: if [ -f ${LOGS}/klodo.log ]; then grep -c Traceback ${LOGS}/klodo.log
        2>/dev/null; true; else echo 0; fi
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T10.4e
      description: Mémoire stable (pas de fuite)
      command: echo check
      assert:
        type: manual_check
        prompt: La mémoire est-elle restée stable pendant le traitement (vérifier
          htop) ?
      mode: manual_check
custom: []
