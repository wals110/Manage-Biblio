      '${INBOX}/.fichier_caché.pdf' 2>/dev/null; true
    setup:
    - touch '${INBOX}/fichier avec  espaces.pdf' '${INBOX}/très-long-nom-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.pdf'
      '${INBOX}/.fichier_caché.pdf'
    checks:
