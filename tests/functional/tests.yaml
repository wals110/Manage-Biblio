      description: classify sur dossier vide termine proprement
      command: ${KLODO} classify -y /tmp/klodo_empty --profile ${PROF} --verbose 2>&1;
        echo "EXIT:$?"
      assert:
        type: output_contains
        expected:
        - EXIT:0
