      command: ${KLODO} clean progress --profile ${PROF} 2>&1
      assert:
        type: output_contains
        expected:
        - DRY-RUN
      mode: auto
    - id: T5.1b
      description: clean progress --execute supprime le checkpoint
      command: ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true && test
        ! -f ${CACHE}/progress.json && echo 'DELETED'
      assert:
        type: output_contains
        expected:
        - supprimé
      mode: auto
    - id: T5.1c
      description: clean isbn --execute supprime le cache ISBN
      command: touch ${CACHE}/isbn_cache.json && ${KLODO} clean isbn --profile ${PROF}
        --execute 2>&1
      assert:
        type: output_contains
        expected:
        - supprimé
      mode: auto
    - id: T5.1d
      description: clean logs --execute supprime les rapports CSV
      command: touch ${LOGS}/rapport_test_cleanup.csv && ${KLODO} clean logs --profile
        ${PROF} --execute 2>&1
      assert:
        type: output_contains
        expected:
        - supprimé
      mode: auto
    - id: T5.1e
      description: clean sur un cache vide affiche 'rien à nettoyer'
      command: ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true && ${KLODO}
        clean progress --profile ${PROF} --execute 2>&1; true
      assert:
        type: output_contains
        expected:
        - Rien à nettoyer
      mode: auto
    - id: T5.1f
      description: clean vision-cache --execute supprime le cache vision persistant
      command: mkdir -p ${CACHE} && echo '{}' > ${CACHE}/vision_cache.json && ${KLODO}
        clean vision-cache --profile ${PROF} --execute 2>&1 && test ! -f ${CACHE}/vision_cache.json
        && echo 'DELETED'
      assert:
        type: output_contains
        expected:
        - DELETED
      mode: auto
  - id: T5.2
    github_issue: 111
