        expected:
        - EXIT:0
      mode: auto
- id: phase_7
  name: Performance et stabilité
  priority: basse
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  post_run: []
  series:
  - id: T7.1
    github_issue: 119
    name: Traitement en volume
    description: Vérifie le traitement d'un grand nombre de fichiers (500+)
    provides:
    - perf_volume
    requires:
    - process_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_process_*.csv ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} --workers 10 --execute
      --verbose 2>&1
    checks:
    - id: T7.1a
      description: Le pipeline traite 500 fichiers sans crash
      command: cat logs/.setup_output_T7.1.txt 2>/dev/null | grep -c 'Pipeline terminé'
        ; true
      assert:
        type: output_equals
        expected: '1'
      mode: auto
    - id: T7.1b
      description: Le traitement se termine dans un temps raisonnable
      command: echo 'Vérifier le temps dans les logs'
      assert:
        type: manual_check
        prompt: Le traitement de 500 fichiers a-t-il pris moins de 30 minutes ?
      mode: manual_check
    - id: T7.1c
      description: Taux de classification acceptable (>80%)
      command: cat logs/.setup_output_T7.1.txt 2>/dev/null | tail -20
      assert:
        type: manual_check
        prompt: Vérifier dans le résumé que le taux de classification est supérieur
          à 80%
      mode: manual_check
  - id: T7.2
    github_issue: 120
    name: Concurrence (workers élevé)
    description: Vérifie la stabilité avec un nombre élevé de workers
    provides:
    - perf_concurrency
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 20 --verbose
      2>&1
    checks:
    - id: T7.2a
      description: Le traitement avec 20 workers se termine sans erreur
      command: cat logs/.setup_output_T7.2.txt 2>/dev/null | grep -c 'Rapport' ; true
      assert:
        type: output_equals
        expected: '1'
      mode: auto
    - id: T7.2b
      description: Le checkpoint est cohérent (pas de corruption)
      command: python3 -c "import json; d=json.load(open('${CACHE}/progress.json'));
        print('OK' if len(d.get('results', d)) > 0 else 'EMPTY')" 2>/dev/null
      assert:
        type: output_equals
        expected: OK
      mode: auto
  - id: T7.3
    github_issue: 121
    name: Flatten en volume
    description: Vérifie que flatten_to_inbox.sh gère le volume complet
    provides:
    - perf_flatten
    requires:
    - flatten_works
    pre_run: []
    post_run: []
    setup:
