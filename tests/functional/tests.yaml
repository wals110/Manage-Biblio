            mode: manual_check

  - id: phase_10
    name: "Performance et stabilité"
    priority: basse
    pre_run: ["${FLATTEN} ${BIBLIO_TEST} --max 500 --execute 2>&1", "${KLODO} clean progress --profile ${PROF} --execute 2>&1"]
    post_run: []
    series:
      - id: T10.1
        github_issue: 79
        name: "Mesurer les temps"
        description: "Benchmarker les performances."
        provides: []
        requires: [smoke_ok]
        pre_run: []
        post_run: []
        setup: []
        checks:
          - id: T10.1a
            description: "Renommage 500 fichiers (sans LLM) < 60 secondes"
            command: "${KLODO} rename ${INBOX} --profile ${PROF} --max 500 2>&1"
            assert: {type: duration_under, seconds: 60}
            mode: auto
          - id: T10.1b
            description: "Classification 500 fichiers (10 workers) < 5 minutes"
            command: "${KLODO} classify ${INBOX} --profile ${PROF} -y --max 500 -w 10 2>&1"
            assert: {type: duration_under, seconds: 300}
            mode: auto
          - id: T10.1c
            description: "Pipeline complet 500 fichiers avec LLM < 15 minutes"
            command: "${KLODO} process ${INBOX} --profile ${PROF} -y --llm --pages 1 -w 10 --max 500 2>&1"
            assert: {type: duration_under, seconds: 900}
            mode: auto
      - id: T10.2
        github_issue: 80
        name: "Stabilité réseau (erreurs API)"
        description: "Provoquer des erreurs réseau et vérifier la résilience."
        provides: []
        requires: [classify_exec_ok]
        pre_run: ["${KLODO} clean progress --profile ${PROF} --execute 2>&1"]
        post_run: []
        setup: ["${KLODO} classify ${INBOX} --profile ${PROF} -y --max 50 --delay 0 -w 20 --verbose 2>&1"]
        checks:
          - id: T10.2a
            description: "Erreurs 429 retry avec backoff"
            command: "grep -ci 'retry\\|backoff\\|429' ${LOGS}/klodo.log 2>/dev/null; true"
            assert: {type: exit_code, expected: 0}
            mode: auto
          - id: T10.2b
            description: "Erreurs 500 ne crashent pas"
            command: "R=$(ls -t ${LOGS}/rapport_classify_*.csv|head -1); grep -c erreur_api \"$R\" 2>/dev/null; true"
            assert: {type: exit_code, expected: 0}
            mode: auto
          - id: T10.2c
            description: "Le traitement continue après les erreurs"
            command: "R=$(ls -t ${LOGS}/rapport_classify_*.csv|head -1)&&tail -n+2 \"$R\"|wc -l|tr -d ' '"
            assert: {type: exit_code, expected: 0}
            mode: auto
          - id: T10.2d
            description: "Max erreurs consécutives arrête proprement"
            command: "grep -ciE 'arrêt|stop|abort|max.*erreur|trop.*erreur' ${LOGS}/.setup_output_T10.2.txt 2>/dev/null; true"
            assert: {type: exit_code, expected: 0}
            mode: auto

custom: []
