version: '1.0'
project: Klodo
generated_at: '2026-04-06T14:00:00+02:00'
variables:
  PROJECT_ROOT: .
  KLODO: ./klodo.sh
  BIBLIO_TEST: /Volumes/ExtSSD/BIBLIO-TEST-FUNC
  INBOX: ${BIBLIO_TEST}/_INBOX
  A_TRIER: ${BIBLIO_TEST}/_A-TRIER
  FLATTEN: echo oui | ./scripts/flatten_to_inbox.sh
  LOGS: logs
  PROFILES: profiles
  PROF: test
  CACHE: ${PROFILES}/${PROF}/.cache
session:
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  post_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
phases:
- id: phase_0
  name: Prérequis et smoke tests
  priority: obligatoire
  pre_run: []
  post_run: []
  series:
  - id: T0.1
    github_issue: 89
    name: Environnement de test
    description: Vérifie que l'environnement de test est fonctionnel (SSD, profil,
      API key)
    provides:
    - env_ready
    requires: []
    pre_run: []
    post_run: []
    setup: []
    checks:
    - id: T0.1a
      description: Le volume SSD de test est monté
      command: test -d ${BIBLIO_TEST} && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T0.1b
      description: Le dossier _INBOX existe
      command: test -d ${INBOX} && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T0.1c
      description: Le profil de test existe et est valide
      command: ${KLODO} profiles 2>&1 | grep -c "^  ${PROF} —" ; true
      assert:
        type: output_equals
        expected: '1'
      mode: auto
    - id: T0.1e
      description: Python 3.13 est disponible via uv
      command: uv run python --version 2>&1 | grep -c '3.13' ; true
      assert:
        type: output_equals
        expected: '1'
      mode: auto
    - id: T0.1f
      description: poppler (pdftoppm) est installé
      command: which pdftoppm > /dev/null 2>&1 && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
  - id: T0.2
    github_issue: 90
    name: Smoke test CLI
    description: Vérifie que le CLI se lance et répond aux commandes de base
    provides:
    - cli_works
    requires:
    - env_ready
    pre_run: []
    post_run: []
    setup: []
    checks:
    - id: T0.2a
      description: klodo --version affiche la version
      command: ${KLODO} --version 2>&1
      assert:
        type: output_contains
        expected:
        - klodo
        - 1.0.0
      mode: auto
    - id: T0.2b
      description: klodo sans argument affiche l'aide
      command: ${KLODO} 2>&1
      assert:
        type: output_contains
        expected:
        - process
        - classify
        - rename
        - refine
        - clean
        - profiles
      mode: auto
    - id: T0.2c
      description: klodo profiles liste au moins le profil default
      command: ${KLODO} profiles 2>&1
      assert:
        type: output_contains
        expected:
        - default
      mode: auto
    - id: T0.2d
      description: klodo avec un profil inexistant échoue proprement
      command: ${KLODO} classify --profile inexistant -y 2>&1 ; true
      assert:
        type: output_contains
        expected:
        - introuvable
      mode: auto
  - id: T0.4
    name: Clé API SiliconFlow
    description: Vérifie que la clé API est configurée (nécessaire pour les tests
      LLM)
    provides:
    - api_ready
    requires:
    - env_ready
    pre_run: []
    post_run: []
    setup: []
    checks:
    - id: T0.4a
      description: Le LLM du profil est accessible
      command: 'PROVIDER=$(grep "provider:" ${PROFILES}/${PROF}/profile.yaml | head
        -1 | awk "{print \$2}"); if [ "$PROVIDER" = "ollama" ]; then curl -s http://localhost:11434/api/tags
        > /dev/null 2>&1 && echo "OK" || echo "FAIL: Ollama non demarre (ollama serve)";
        else test -n "$SILICONFLOW_API_KEY" && echo "OK" || echo "FAIL: SILICONFLOW_API_KEY
        non definie"; fi'
      assert:
        type: output_equals
        expected: OK
      mode: auto
  - id: T0.3
    github_issue: 91
    name: Script de remise à zéro
    description: Vérifie que flatten_to_inbox.sh fonctionne correctement
    provides:
    - flatten_works
    requires:
    - env_ready
    pre_run: []
    post_run: []
    setup:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    checks:
    - id: T0.3a
      description: Après flatten, tous les PDFs sont dans _INBOX
      command: find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' | wc -l |
        tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T0.3b
      description: Après flatten, _INBOX contient des PDFs
      command: COUNT=$(find ${INBOX} -name '*.pdf' | wc -l | tr -d ' '); echo $COUNT;
        test $COUNT -gt 0
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T0.3c
      description: L'arborescence des dossiers est préservée (vide mais intacte)
      command: ls ${BIBLIO_TEST}/01-SCIENCES 2>&1
      assert:
        type: output_contains
        expected:
        - MATHEMATIQUES
        - PHYSIQUE
      mode: auto
    - id: T0.3d
      description: flatten en dry-run ne déplace rien
      command: ${FLATTEN} ${BIBLIO_TEST} 2>&1 | tail -5
      assert:
        type: exit_code
        expected: 0
      mode: auto
- id: phase_1
  name: Renommage
  priority: obligatoire
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  post_run: []
  series:
  - id: T1.1
    github_issue: 92
    name: Rename dry-run sur petit lot
    description: Vérifie que rename en dry-run génère un rapport sans modifier les
      fichiers
    provides:
    - rename_dryrun
    requires:
    - cli_works
    - flatten_works
    pre_run: []
    post_run: []
    setup:
    - ${KLODO} rename --profile ${PROF} --verbose 2>&1
    checks:
    - id: T1.1a
      description: Un rapport CSV rename est généré dans logs/
      command: ls -t ${LOGS}/rapport_rename_*.csv 2>/dev/null | head -1
      assert:
        type: file_exists
        pattern: ${LOGS}/rapport_rename_*.csv
      mode: auto
    - id: T1.1b
      description: Le rapport contient des lignes (hors header)
      command: R=$(ls -t ${LOGS}/rapport_rename_*.csv 2>/dev/null | head -1); COUNT=$(tail
        -n+2 "$R" 2>/dev/null | wc -l | tr -d ' '); echo $COUNT; test $COUNT -gt 0
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T1.1c
      description: Aucun fichier n'a été renommé (dry-run)
      command: find ${INBOX} -name '*.pdf' -newer ${LOGS}/rapport_rename_*.csv 2>/dev/null
        | wc -l | tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T1.1d
      description: Le rapport CSV contient les colonnes attendues
      command: head -1 $(ls -t ${LOGS}/rapport_rename_*.csv | head -1) 2>/dev/null
      assert:
        type: output_contains
        expected:
        - ancien_nom
        - nouveau_nom
        - action
      mode: auto
  - id: T1.2
    github_issue: 93
    name: Rename effectif (sans LLM)
    description: Vérifie que rename --execute renomme les fichiers avec noms junk
    provides:
    - rename_execute
    requires:
    - rename_dryrun
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} rename --profile ${PROF} --execute --verbose 2>&1
    checks:
    - id: T1.2a
      description: Le rapport indique des fichiers renommés
      command: grep -c 'renomm' $(ls -t ${LOGS}/rapport_rename_*.csv | head -1) ;
        true
      assert:
        type: output_contains
        expected:
        - '0'
      mode: auto
    - id: T1.2b
      description: Les fichiers renommés ont des noms propres (pas de hash MD5)
      command: find ${INBOX} -name '*.pdf' | head -10
      assert:
        type: manual_check
        prompt: Vérifier visuellement que les noms renommés sont du type 'Titre -
          Auteur.pdf' ou 'Titre.pdf', pas des hash MD5 ou IDs numériques
      mode: manual_check
    - id: T1.2c
      description: Pas de fichier écrasé (pas de doublon créé par le renommage)
      command: R=$(ls -t ${LOGS}/rapport_rename_*.csv | head -1); awk -F',' '$4=="RENOMME"
        && $3~/(\(2\)|\(3\))/' "$R" | wc -l | tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
  - id: T1.3
    github_issue: 94
    name: Rename avec LLM Vision
    description: Vérifie que rename --llm utilise l'API Vision pour améliorer les
      noms
    provides:
    - rename_llm
    requires:
    - rename_execute
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} rename --profile ${PROF} --llm --pages 2 --execute --verbose
      2>&1
    checks:
    - id: T1.3a
      description: Le rapport indique le mode LLM Vision
      command: cat logs/.setup_output_T1.3.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - LLM Vision
      mode: auto
    - id: T1.3b
      description: Des fichiers ont été renommés via LLM
      command: grep -q 'EXTRAIRE_LLM' $(ls -t ${LOGS}/rapport_rename_*.csv | head
        -1) && echo "oui" || echo "non"
      assert:
        type: output_contains
        expected:
        - oui
      mode: auto
    - id: T1.3c
      description: Qualité des noms générés par LLM
      command: find ${INBOX} -name '*.pdf' | head -10
      assert:
        type: manual_check
        prompt: Vérifier que les noms générés par LLM Vision sont intelligents et
          descriptifs
      mode: manual_check
  - id: T1.4
    github_issue: 95
    name: Rename --force avec LLM Vision
    description: Vérifie que --force --llm ré-analyse même les fichiers déjà propres
      en passant par le LLM Vision
    provides:
    - rename_force
    requires:
    - rename_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} rename --profile ${PROF} --force --llm --pages 2 --execute --verbose
      2>&1
    checks:
    - id: T1.4a
      description: En mode force, aucun fichier n'est marqué INCHANGE (tous sont ré-analysés)
      command: C=$(grep -c INCHANGE $(ls -t ${LOGS}/rapport_rename_*.csv | head -1)
        2>/dev/null || true); echo "${C:-0}"
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T1.4b
      description: Au moins un fichier a été ré-analysé via LLM Vision
      command: grep -q 'EXTRAIRE_LLM' $(ls -t ${LOGS}/rapport_rename_*.csv | head
        -1) && echo "oui" || echo "non"
      assert:
        type: output_contains
        expected:
        - oui
      mode: auto
  - id: T1.5
    github_issue: 96
    name: Idempotence du renommage
    description: Relancer le renommage ne modifie plus les fichiers déjà propres
    provides: []
    requires:
    - rename_execute
    pre_run: []
    post_run: []
    setup:
    # Premier passage : renomme les fichiers
    - ${KLODO} rename --profile ${PROF} --execute --verbose 2>&1
    # Second passage : doit être idempotent (aucun renommage effectif)
    - ${KLODO} rename --profile ${PROF} --execute --verbose 2>&1
    checks:
    - id: T1.5a
      description: Le 2e rapport contient des lignes INCHANGE (fichiers déjà propres)
      command: R=$(ls -t ${LOGS}/rapport_rename_*.csv|head -1); C=$(grep -c INCHANGE
        "$R" 2>/dev/null || true); echo "${C:-0}"
      assert:
        type: output_not_contains
        expected:
        - '0'
      mode: auto
    - id: T1.5b
      description: 0 fichiers effectivement renommés au 2e passage
      command: R=$(ls -t ${LOGS}/log_renommage_*.csv|head -1); C=$(grep -c OK "$R"
        2>/dev/null || true); echo "${C:-0}"
      assert:
        type: output_equals
        expected: '0'
      mode: auto
- id: phase_2
  name: Classification LLM
  priority: obligatoire
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  post_run: []
  series:
  - id: T2.1
    github_issue: 97
    name: Classify dry-run
    description: Vérifie que classify sans --execute génère un rapport sans copier
      de fichier
    provides:
    - classify_dryrun
    requires:
    - cli_works
    - flatten_works
    - api_ready
    pre_run:
    - rm -f ${LOGS}/rapport_classify_*.csv
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 5 --verbose
      2>&1
    checks:
    - id: T2.1a
      description: Un rapport CSV classify est généré dans logs/
      command: ls -t ${LOGS}/rapport_classify_*.csv 2>/dev/null | head -1
      assert:
        type: file_exists
        pattern: ${LOGS}/rapport_classify_*.csv
      mode: auto
    - id: T2.1b
      description: Le rapport contient des résultats classifiés
      command: "COUNT=$(grep -c 'classifié' $(ls -t ${LOGS}/rapport_classify_*.csv | head -1) 2>/dev/null; true); echo $COUNT; test $COUNT -gt 0"
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T2.1c
      description: Aucun fichier n'a été copié (dry-run)
      command: find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' | wc -l |
        tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
    - id: T2.1d
      description: Un checkpoint est créé dans le cache du profil
      command: test -f ${CACHE}/progress.json && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T2.1e
      description: Le résumé affiche les statistiques (classifiés, erreurs, coût)
      command: cat logs/.setup_output_T2.1.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - classifié
        - fichiers
      mode: auto
  - id: T2.2
    github_issue: 98
    name: Classify --execute (copie vers cible)
    description: Vérifie que classify --execute copie les fichiers classifiés et nettoie
      l'inbox
    provides:
    - classify_execute
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_classify_*.csv
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 5 --execute
      --verbose 2>&1
    checks:
    - id: T2.2a
      description: Des fichiers ont été copiés dans l'arborescence cible
      command: COUNT=$(find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' -not
        -path '*/_A-TRIER/*' | wc -l | tr -d ' '); echo $COUNT; test $COUNT -gt 0
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T2.2b
      description: Les fichiers classifiés ont été retirés de l'inbox
      command: cat logs/.setup_output_T2.2.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - supprimé
      mode: auto
    - id: T2.2c
      description: Le dossier _A-TRIER existe (les non classifiés y seraient placés)
      command: test -d ${A_TRIER} && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T2.2d
      description: Les fichiers sont dans des dossiers cohérents
      command: find ${BIBLIO_TEST}/01-SCIENCES -name '*.pdf' 2>/dev/null | head -3
        ; find ${BIBLIO_TEST}/02-INFORMATIQUE -name '*.pdf' 2>/dev/null | head -3
      assert:
        type: manual_check
        prompt: Vérifier que les fichiers dans 01-SCIENCES et 02-INFORMATIQUE correspondent
          bien à ces disciplines
      mode: manual_check
  - id: T2.3
    github_issue: 99
    name: Checkpoint et reprise
    description: Vérifie que le mécanisme de checkpoint permet de reprendre un traitement
      interrompu
    provides:
    - classify_checkpoint
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 1 --verbose
      2>&1
    checks:
    - id: T2.3a
      description: Le checkpoint contient des résultats du premier run
      command: python3 -c "import json; d=json.load(open('${CACHE}/progress.json'));
        n=len(d.get('results', d)); print(n); exit(0 if n>0 else 1)" 2>/dev/null
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T2.3b
      description: Un deuxième run reprend là où le premier s'est arrêté
      command: ${KLODO} classify -y --profile ${PROF} --workers
        1 --verbose 2>&1 | grep -c 'Reprise' ; true
      assert:
        type: output_contains
        expected:
        - '1'
      mode: auto
    - id: T2.3c
      description: Avec --reset, le traitement repart de zéro
      command: ${KLODO} classify -y --profile ${PROF} --workers 1
        --reset --verbose 2>&1 | grep -c 'Reprise' ; true
      assert:
        type: output_equals
        expected: '0'
      mode: auto
  - id: T2.4
    github_issue: 100
    name: Classify --retry-errors
    description: Vérifie que --retry-errors retraite les fichiers en erreur
    provides:
    - classify_retry
    requires:
    - classify_checkpoint
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 5 --verbose
      2>&1
    checks:
    - id: T2.4a
      description: Avec --retry-errors, les fichiers erreur sont retraités
      command: ${KLODO} classify -y --profile ${PROF} --retry-errors --verbose
        2>&1 | tail -5
      assert:
        type: output_contains
        expected:
        - Rapport
      mode: auto
  - id: T2.5
    github_issue: 101
    name: Classify avec escalade vision
    description: Vérifie que --vision active l'escalade dans le mapper
    provides:
    - classify_vision
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --vision --pages 2
      --verbose 2>&1
    checks:
    - id: T2.5a
      description: Le mode vision est affiché dans les logs
      command: cat logs/.setup_output_T2.5.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - Vision
        - escalade
      mode: auto
  - id: T2.6
    github_issue: null
    name: Cache vision persistant
    description: Vérifie que le cache vision persistant (vision_cache.json) est créé
      au premier run, réutilisé au second (économie d'appels LLM) et purgeable via
      clean vision-cache
    provides:
    - vision_cache_persistent
    requires:
    - classify_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - ${KLODO} clean vision-cache --profile ${PROF} --execute 2>&1; true
    post_run: []
    setup:
    - ${KLODO} classify -y --profile ${PROF} --workers 5 --verbose 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - ${KLODO} classify -y --profile ${PROF} --workers 5 --verbose 2>&1
    checks:
    - id: T2.6a
      description: Le fichier vision_cache.json est créé dans le cache du profil
        après un run classify
      command: test -f ${CACHE}/vision_cache.json && echo 'OK'
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T2.6b
      description: Le cache vision contient au moins une entrée sérialisée
      command: python3 -c "import json; d=json.load(open('${CACHE}/vision_cache.json'));
        print(len(d)); exit(0 if len(d)>0 else 1)" 2>/dev/null
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T2.6c
      description: Les entrées cachées ont la structure attendue (model, prompt_version,
        result avec title)
      command: python3 -c "import json; d=json.load(open('${CACHE}/vision_cache.json'));
        e=next(iter(d.values())); assert 'model' in e and 'prompt_version' in e and
        'result' in e and e['result'].get('title'); print('OK')" 2>/dev/null
      assert:
        type: output_equals
        expected: OK
      mode: auto
    - id: T2.6d
      description: clean vision-cache --execute purge complètement le cache
      command: ${KLODO} clean vision-cache --profile ${PROF} --execute 2>&1 && test
        ! -f ${CACHE}/vision_cache.json && echo 'PURGED'
      assert:
        type: output_contains
        expected:
        - PURGED
      mode: auto
- id: phase_3
  name: Raffinement
  priority: haute
  pre_run: []
  post_run: []
  series:
  - id: T3.1
    github_issue: 102
    name: Refine dry-run
    description: Vérifie que refine sans --execute affiche les déplacements sans les
      appliquer
    provides:
    - refine_dryrun
    requires:
    - classify_execute
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1; true
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/refine_*.csv
    - ${KLODO} classify -y --profile ${PROF} -w 5 --execute --verbose 2>&1
    post_run: []
    setup:
    - ${KLODO} refine --profile ${PROF} --verbose 2>&1
    checks:
    - id: T3.1a
      description: Un rapport refine CSV est généré
      command: ls -t ${LOGS}/refine_*.csv 2>/dev/null | head -1
      assert:
        type: file_exists
        pattern: ${LOGS}/refine_*.csv
      mode: auto
    - id: T3.1b
      description: Le rapport contient des lignes (déplacements proposés)
      command: R=$(ls -t ${LOGS}/refine_*.csv 2>/dev/null | head -1); COUNT=$(tail
        -n+2 "$R" 2>/dev/null | wc -l | tr -d ' '); echo $COUNT; test $COUNT -gt 0
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T3.1c
      description: Aucun fichier n'a été déplacé (dry-run)
      command: cat logs/.setup_output_T3.1.txt 2>/dev/null
      assert:
        type: output_not_contains
        expected:
        - déplacé
      mode: auto
  - id: T3.2
    github_issue: 103
    name: Refine --execute
    description: Vérifie que refine --execute déplace les fichiers dans les bonnes
      sous-catégories
    provides:
    - refine_execute
    requires:
    - refine_dryrun
    pre_run:
    - rm -f ${LOGS}/refine_*.csv
    post_run: []
    setup:
    - ${KLODO} refine --profile ${PROF} --execute --verbose 2>&1
    checks:
    - id: T3.2a
      description: Des fichiers ont été déplacés dans des sous-catégories
      command: cat logs/.setup_output_T3.2.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - Rapport
      mode: auto
    - id: T3.2b
      description: 'Le raffinement est cohérent (ex: un livre de maths va dans le
        bon sous-dossier)'
      command: find ${BIBLIO_TEST}/01-SCIENCES/MATHEMATIQUES -name '*.pdf' 2>/dev/null
        | head -5
      assert:
        type: manual_check
        prompt: Vérifier que les PDFs dans MATHEMATIQUES sont dans des sous-dossiers
          pertinents (Algebre, Analyse, etc.)
      mode: manual_check
  - id: T3.3
    github_issue: 104
    name: Refine avec LLM fallback
    description: Vérifie que refine --llm utilise le LLM pour les fichiers non matchés
      par les règles YAML
    provides:
    - refine_llm
    requires:
    - refine_execute
    pre_run:
    - rm -f ${LOGS}/refine_*.csv
    post_run: []
    setup:
    - ${KLODO} refine --profile ${PROF} --llm --verbose 2>&1
    checks:
    - id: T3.3a
      description: Le LLM refine est actif dans les logs
      command: cat logs/.setup_output_T3.3.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - LLM
      mode: auto
    - id: T3.3b
      description: Des appels LLM ont été effectués
      command: cat logs/.setup_output_T3.3.txt 2>/dev/null | grep -ci 'LLM'
      assert:
        type: exit_code
        expected: 0
      mode: auto
  - id: T3.4
    github_issue: 105
    name: Refine idempotence
    description: Vérifie que relancer refine après un premier run ne déplace plus
      rien
    provides:
    - refine_idempotent
    requires:
    - refine_execute
    pre_run: []
    post_run: []
    setup:
    - ${KLODO} refine --profile ${PROF} --execute --verbose 2>&1
    checks:
    - id: T3.4a
      description: Le deuxième run ne déplace aucun fichier
      command: "R=$(ls -t ${LOGS}/refine_*.csv 2>/dev/null | head -1); tail -n+2 \"$R\" 2>/dev/null | grep -ci 'déplacé' ; true"
      assert:
        type: output_equals
        expected: '0'
      mode: auto
- id: phase_4
  name: Pipeline complet (process)
  priority: obligatoire
  pre_run:
  - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
  - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
  - rm -f ${LOGS}/rapport_process_*.csv ${LOGS}/rapport_rename_*.csv ${LOGS}/refine_*.csv
  post_run: []
  series:
  - id: T4.1
    github_issue: 106
    name: Process dry-run
    description: Vérifie que process sans --execute exécute le pipeline en dry-run
    provides:
    - process_dryrun
    requires:
    - cli_works
    - flatten_works
    - api_ready
    pre_run: []
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} --workers 5 --verbose
      2>&1
    checks:
    - id: T4.1a
      description: Le pipeline affiche les 3 étapes (rename, classify, rapport)
      command: cat logs/.setup_output_T4.1.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - Renommage
        - Classification
        - Pipeline
      mode: auto
    - id: T4.1b
      description: Un rapport process est généré (pas rapport_classify)
      command: ls -t ${LOGS}/rapport_process_*.csv 2>/dev/null | head -1
      assert:
        type: file_exists
        pattern: ${LOGS}/rapport_process_*.csv
      mode: auto
    - id: T4.1c
      description: Aucun fichier copié en dry-run
      command: find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' | wc -l |
        tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
  - id: T4.2
    github_issue: 107
    name: Process --execute (pipeline complet)
    description: 'Vérifie le pipeline complet : rename → classify → copie → refine'
    provides:
    - process_execute
    requires:
    - process_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_process_*.csv ${LOGS}/rapport_rename_*.csv ${LOGS}/refine_*.csv
    - find ${INBOX} -name '*.pdf' | wc -l | tr -d ' ' > logs/.inbox_count_before_T4.2.txt
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} --workers 5 --execute
      --verbose 2>&1
    checks:
    - id: T4.2a
      description: Le pipeline a exécuté les 4 étapes (rename, classify, copie, refine)
      command: cat logs/.setup_output_T4.2.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - Renommage
        - Classification
        - Copie
        - Raffinement
        - Pipeline terminé
      mode: auto
    - id: T4.2b
      description: Des fichiers ont été copiés dans l'arborescence
      command: COUNT=$(find ${BIBLIO_TEST} -name '*.pdf' -not -path '*/_INBOX/*' |
        wc -l | tr -d ' '); echo $COUNT; test $COUNT -gt 0
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T4.2c
      description: L'inbox a été vidée des fichiers classifiés (moins de fichiers qu'avant)
      command: BEFORE=$(cat logs/.inbox_count_before_T4.2.txt 2>/dev/null || echo 0);
        AFTER=$(find ${INBOX} -name '*.pdf' | wc -l | tr -d ' '); echo "avant=$BEFORE
        apres=$AFTER"; test $AFTER -lt $BEFORE
      assert:
        type: exit_code
        expected: 0
      mode: auto
    - id: T4.2d
      description: Un rapport rename ET un rapport process existent
      command: ls ${LOGS}/rapport_rename_*.csv ${LOGS}/rapport_process_*.csv 2>/dev/null
        | wc -l | tr -d ' '
      assert:
        type: output_equals
        expected: '2'
      mode: auto
  - id: T4.3
    github_issue: 108
    name: Process --no-rename
    description: Vérifie que --no-rename skip l'étape de renommage
    provides:
    - process_no_rename
    requires:
    - process_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_process_*.csv ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} --no-rename --workers
      5 --verbose 2>&1
    checks:
    - id: T4.3a
      description: Le pipeline n'exécute pas l'étape de renommage
      command: cat logs/.setup_output_T4.3.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - --no-rename
      mode: auto
    - id: T4.3b
      description: Aucun rapport rename n'est généré
      command: ls ${LOGS}/rapport_rename_*.csv 2>/dev/null | wc -l | tr -d ' '
      assert:
        type: output_equals
        expected: '0'
      mode: auto
  - id: T4.4
    github_issue: 109
    name: Process avec LLM Vision
    description: Vérifie que process --llm --pages 2 active LLM Vision pour le renommage
    provides:
    - process_llm
    requires:
    - process_dryrun
    - api_ready
    pre_run:
    - ${FLATTEN} ${BIBLIO_TEST} --execute 2>&1
    - ${KLODO} clean progress --profile ${PROF} --execute 2>&1; true
    - rm -f ${LOGS}/rapport_process_*.csv ${LOGS}/rapport_rename_*.csv
    post_run: []
    setup:
    - ${KLODO} process -y --profile ${PROF} --llm --pages 2 --workers
      3 --execute --verbose 2>&1
    checks:
    - id: T4.4a
      description: Le mode LLM Vision est affiché
      command: cat logs/.setup_output_T4.4.txt 2>/dev/null
      assert:
        type: output_contains
        expected:
        - LLM Vision
      mode: auto
- id: phase_5
  name: Commandes utilitaires
  priority: moyenne
  pre_run: []
  post_run: []
  series:
  - id: T5.1
    github_issue: 110
    name: clean — Nettoyage du cache
    description: Vérifie les différents modes de nettoyage du cache
    provides:
    - clean_works
    requires:
    - cli_works
    pre_run: []
    post_run: []
    setup:
    - touch ${CACHE}/progress.json ${CACHE}/isbn_cache.json 2>/dev/null; true
    checks:
