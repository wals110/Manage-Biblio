<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klodo — {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">K<span>lodo</span></div>
        <ul class="sidebar-nav">
            <li><a href="/" class="{% if active == 'overview' %}active{% endif %}">Overview</a></li>
            <li><a href="/tests" class="{% if active == 'tests' %}active{% endif %}">Tests</a></li>
            <li><a href="/viewer" class="{% if active == 'viewer' %}active{% endif %}">Curation</a></li>
            <li><a href="/baseline" class="{% if active == 'baseline' %}active{% endif %}">Baseline</a></li>
            <li><a href="/taxonomy" class="{% if active == 'taxonomy' %}active{% endif %}">Taxonomie</a></li>
            <li><a href="/logs" class="{% if active == 'logs' %}active{% endif %}">Logs</a></li>
            <li style="margin-top:16px;border-top:1px solid var(--border);padding-top:8px;">
                <a href="/onboarding" class="{% if active == 'onboarding' %}active{% endif %}">&#10133; Nouveau profil</a>
            </li>
            <li>
                <a href="/admin" class="{% if active == 'admin' %}active{% endif %}">&#9881; Admin</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            Klodo v1.0.0-dev<br>
            Profil : default
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
<script src="/static/js/common.js"></script>
<script src="/static/js/validation.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
