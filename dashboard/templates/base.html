<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klodo — {% block title %}Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">K<span>lodo</span></div>
        <ul class="sidebar-nav">
            <li><a href="/" class="{% if active == 'overview' %}active{% endif %}">Overview</a></li>
            <li><a href="/tests" class="{% if active == 'tests' %}active{% endif %}">Tests</a></li>
            <li><a href="/rapports" class="{% if active == 'rapports' %}active{% endif %}">Rapports</a></li>
            <li><a href="/comparer" class="{% if active == 'comparer' %}active{% endif %}">Comparer</a></li>
            <li><a href="/metriques" class="{% if active == 'metriques' %}active{% endif %}">M&eacute;triques</a></li>
            <li><a href="/historique" class="{% if active == 'historique' %}active{% endif %}">Historique</a></li>
            <li><a href="/suggestions" class="{% if active == 'suggestions' %}active{% endif %}">Suggestions</a></li>
        </ul>
        <div class="sidebar-footer">
            Klodo v1.0.0-dev<br>
            Profil : default
        </div>
    </aside>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
<script>
function copyCmd(btn, text) {
    navigator.clipboard.writeText(text).then(function() {
        btn.textContent = '✓';
        btn.classList.add('copied');
        setTimeout(function() {
            btn.textContent = '📋';
            btn.classList.remove('copied');
        }, 1500);
    });
}

function activateStops(btn) {
    // Activate the phase stop button and global stop button
    var phase = btn.closest('.phase-accordion');
    if (phase) {
        var phaseStop = phase.querySelector('.btn-phase-stop');
        if (phaseStop) {
            phaseStop.disabled = false;
            phaseStop.className = 'btn btn-stop btn-sm btn-phase-stop';
        }
    }
    var globalStop = document.getElementById('btn-stop');
    if (globalStop) {
        globalStop.disabled = false;
        globalStop.className = 'btn btn-stop';
    }
}
</script>
</body>
</html>
