<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aaa"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="22" font-weight="600" fill="#1e1e1e">Pipeline de Renommage Intelligent</text>

  <!-- Input PDF -->
  <rect x="240" y="48" width="200" height="44" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="76" text-anchor="middle" font-size="16" font-weight="500" fill="#1e3a5f">fichier.pdf</text>

  <!-- Arrow to step 1 -->
  <line x1="340" y1="92" x2="340" y2="118" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cascade zone -->
  <rect x="190" y="115" width="350" height="340" rx="12" fill="#f8f5ff" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="520" y="135" font-size="12" fill="#8b5cf6" font-weight="500">Cascade</text>
  <text x="520" y="149" font-size="11" fill="#a78bfa">(1er succes gagne)</text>

  <!-- Step 1: Nettoyage -->
  <rect x="215" y="130" width="240" height="44" rx="8" fill="#b2f2bb" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="157" font-size="14" font-weight="600" fill="#14532d">1.</text>
  <text x="260" y="157" font-size="14" font-weight="500" fill="#14532d">Nettoyage du nom</text>

  <!-- Arrow -->
  <line x1="335" y1="174" x2="335" y2="196" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>

  <!-- Step 2: ISBN -->
  <rect x="215" y="198" width="240" height="44" rx="8" fill="#fff3bf" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="225" font-size="14" font-weight="600" fill="#78350f">2.</text>
  <text x="260" y="225" font-size="14" font-weight="500" fill="#78350f">Recherche ISBN</text>

  <!-- Arrow -->
  <line x1="335" y1="242" x2="335" y2="264" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>

  <!-- Step 3: PDF metadata -->
  <rect x="215" y="266" width="240" height="44" rx="8" fill="#ffd8a8" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="293" font-size="14" font-weight="600" fill="#78350f">3.</text>
  <text x="260" y="293" font-size="14" font-weight="500" fill="#78350f">Metadonnees PDF</text>

  <!-- Arrow -->
  <line x1="335" y1="310" x2="335" y2="332" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>

  <!-- Step 4: LLM Vision -->
  <rect x="215" y="334" width="240" height="44" rx="8" fill="#d0bfff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="361" font-size="14" font-weight="600" fill="#3b0764">4.</text>
  <text x="260" y="361" font-size="14" font-weight="500" fill="#3b0764">LLM Vision</text>

  <!-- --pages annotation -->
  <rect x="470" y="338" width="100" height="36" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="520" y="354" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="500">--pages N</text>
  <text x="520" y="368" text-anchor="middle" font-size="10" fill="#8b5cf6">multi-pages</text>

  <!-- Arrow -->
  <line x1="335" y1="378" x2="335" y2="400" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>

  <!-- Step 5: Folder name -->
  <rect x="215" y="402" width="240" height="44" rx="8" fill="#c3fae8" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="429" font-size="14" font-weight="600" fill="#14532d">5.</text>
  <text x="260" y="429" font-size="14" font-weight="500" fill="#14532d">Nom du dossier</text>

  <!-- Force zone -->
  <rect x="18" y="175" width="165" height="220" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="100" y="198" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">--force + --llm</text>
  <text x="100" y="216" text-anchor="middle" font-size="12" fill="#b91c1c">LLM en priorite</text>
  <text x="100" y="232" text-anchor="middle" font-size="11" fill="#dc2626">(bypass etapes 1-3)</text>

  <!-- Force arrow -->
  <path d="M 140 260 C 160 300, 190 340, 215 356" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>

  <!-- Arrow to result -->
  <line x1="340" y1="455" x2="340" y2="490" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="210" y="492" width="260" height="50" rx="10" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="523" text-anchor="middle" font-size="18" font-weight="600" fill="#14532d">Titre - Auteur.pdf</text>
</svg>
