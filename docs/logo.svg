<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book icon -->
  <g transform="translate(15, 15)">
    <!-- Book body -->
    <rect x="5" y="8" width="55" height="72" rx="3" fill="url(#grad1)" />
    <rect x="10" y="12" width="46" height="64" rx="2" fill="#EEF2FF" />
    <!-- Book spine -->
    <rect x="5" y="8" width="8" height="72" rx="2" fill="#3730A3" />
    <!-- Book lines -->
    <line x1="20" y1="28" x2="48" y2="28" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="36" x2="44" y2="36" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="44" x2="46" y2="44" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>
    <!-- AI brain sparkle -->
    <circle cx="34" cy="60" r="10" fill="url(#grad2)" opacity="0.9"/>
    <path d="M30 60 L34 54 L38 60 L34 66 Z" fill="white" opacity="0.8"/>
    <circle cx="34" cy="60" r="2.5" fill="white"/>
    <!-- Gear (small) -->
    <g transform="translate(52, 68)">
      <circle cx="0" cy="0" r="10" fill="url(#grad2)" />
      <circle cx="0" cy="0" r="5" fill="#EEF2FF" />
      <rect x="-2" y="-12" width="4" height="24" rx="1" fill="url(#grad2)"/>
      <rect x="-12" y="-2" width="24" height="4" rx="1" fill="url(#grad2)"/>
      <rect x="-2" y="-12" width="4" height="24" rx="1" fill="url(#grad2)" transform="rotate(45)"/>
      <rect x="-12" y="-2" width="24" height="4" rx="1" fill="url(#grad2)" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="4" fill="#EEF2FF" />
    </g>
  </g>

  <!-- Text -->
  <text x="100" y="55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#1E1B4B">
    Biblio
  </text>
  <text x="100" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#6366F1" letter-spacing="3">
    PDF LIBRARY MANAGER
  </text>
  <text x="100" y="102" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#9CA3AF">
    AI-powered classification &amp; organization
  </text>
</svg>
