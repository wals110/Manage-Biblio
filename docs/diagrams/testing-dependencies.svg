<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="800" height="350" fill="#0f172a" rx="12"/>
  <text x="400" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Systeme de dependances (provides / requires)</text>

  <!-- T0.1 -->
  <rect x="40" y="60" width="200" height="45" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">T0.1 Environnement</text>
  <text x="140" y="97" text-anchor="middle" fill="#64748b" font-size="10">provides: [env_ready]</text>

  <!-- T0.2 -->
  <rect x="40" y="120" width="200" height="45" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="140" y="142" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">T0.2 Outils CLI</text>
  <text x="140" y="157" text-anchor="middle" fill="#64748b" font-size="10">provides: [ssd_ok]</text>

  <!-- T1.1 -->
  <rect x="320" y="60" width="200" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="82" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">T1.1 Rename dry-run</text>
  <text x="420" y="97" text-anchor="middle" fill="#64748b" font-size="10">provides: [rename_works]</text>

  <!-- T2.1 -->
  <rect x="320" y="120" width="200" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="420" y="142" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">T2.1 Classify dry-run</text>
  <text x="420" y="157" text-anchor="middle" fill="#64748b" font-size="10">provides: [classify_works]</text>

  <!-- T4.1 -->
  <rect x="580" y="90" width="190" height="45" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="675" y="112" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">T4.1 Process complet</text>
  <text x="675" y="127" text-anchor="middle" fill="#64748b" font-size="10">requires: [rename, classify]</text>

  <!-- Arrows provides -->
  <line x1="240" y1="82" x2="318" y2="82" stroke="#4ade80" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="279" y="75" text-anchor="middle" fill="#4ade80" font-size="9">env_ready</text>
  <line x1="240" y1="82" x2="318" y2="142" stroke="#4ade80" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="520" y1="82" x2="578" y2="105" stroke="#4ade80" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="520" y1="142" x2="578" y2="118" stroke="#4ade80" stroke-width="1.2" marker-end="url(#a1)"/>

  <!-- Failure scenario -->
  <rect x="40" y="210" width="720" height="120" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="60" y="235" fill="#f87171" font-size="13" font-weight="700">Si T0.1 echoue :</text>

  <rect x="60" y="250" width="140" height="35" rx="6" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="1"/>
  <text x="130" y="272" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">T0.1 FAIL</text>

  <line x1="200" y1="267" x2="260" y2="267" stroke="#f87171" stroke-width="1.5" marker-end="url(#a2)"/>

  <rect x="265" y="250" width="140" height="35" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
  <text x="335" y="272" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">T1.1 SKIP</text>

  <rect x="420" y="250" width="140" height="35" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
  <text x="490" y="272" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">T2.1 SKIP</text>

  <rect x="575" y="250" width="140" height="35" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
  <text x="645" y="272" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">T4.1 SKIP</text>

  <text x="400" y="310" text-anchor="middle" fill="#64748b" font-size="10">Les series dependantes sont automatiquement SKIP (dependance non satisfaite)</text>
</svg>
