<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#0f172a" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Flux complet d'un run de tests</text>

  <!-- User -->
  <rect x="350" y="50" width="200" height="40" rx="8" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="450" y="75" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Utilisateur (dashboard ou CLI)</text>
  <line x1="450" y1="90" x2="450" y2="115" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Runner -->
  <rect x="320" y="118" width="260" height="40" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="450" y="143" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="700">run_functional.py</text>
  <line x1="450" y1="158" x2="450" y2="183" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Klodo commands -->
  <rect x="150" y="186" width="140" height="45" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="220" y="206" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">klodo.sh rename</text>
  <text x="220" y="222" text-anchor="middle" fill="#64748b" font-size="9">rapport_rename_*.csv</text>

  <rect x="330" y="186" width="140" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="206" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">klodo.sh classify</text>
  <text x="400" y="222" text-anchor="middle" fill="#64748b" font-size="9">rapport_classify_*.csv</text>

  <rect x="510" y="186" width="140" height="45" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="580" y="206" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">klodo.sh process</text>
  <text x="580" y="222" text-anchor="middle" fill="#64748b" font-size="9">rapport_process_*.csv</text>

  <rect x="690" y="186" width="140" height="45" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="760" y="206" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">klodo.sh refine</text>
  <text x="760" y="222" text-anchor="middle" fill="#64748b" font-size="9">refine_*.csv</text>

  <!-- Arrows runner → klodo -->
  <line x1="370" y1="158" x2="220" y2="184" stroke="#64748b" stroke-width="1.2" marker-end="url(#fa)"/>
  <line x1="430" y1="158" x2="400" y2="184" stroke="#64748b" stroke-width="1.2" marker-end="url(#fa)"/>
  <line x1="500" y1="158" x2="580" y2="184" stroke="#64748b" stroke-width="1.2" marker-end="url(#fa)"/>
  <line x1="530" y1="158" x2="760" y2="184" stroke="#64748b" stroke-width="1.2" marker-end="url(#fa)"/>

  <!-- Post-processing -->
  <line x1="450" y1="231" x2="450" y2="270" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>
  <rect x="250" y="273" width="400" height="35" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="296" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Post-processing : deplace CSV → logs/phase_N/T*.*/</text>

  <!-- Generate report -->
  <line x1="450" y1="308" x2="450" y2="333" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>
  <rect x="250" y="336" width="400" height="35" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="359" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Genere report.json + report.md</text>

  <!-- Insert DuckDB -->
  <line x1="450" y1="371" x2="450" y2="396" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>
  <rect x="250" y="399" width="400" height="35" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="450" y="422" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Insere dans DuckDB ("cosmic-koala" + git info)</text>

  <!-- Three outputs -->
  <line x1="300" y1="434" x2="150" y2="475" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="450" y1="434" x2="450" y2="475" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="600" y1="434" x2="750" y2="475" stroke="#64748b" stroke-width="1.5" marker-end="url(#fa)"/>

  <rect x="60" y="478" width="190" height="60" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="155" y="503" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Logs structures</text>
  <text x="155" y="520" text-anchor="middle" fill="#64748b" font-size="10">logs/phase_N/T*.*/</text>
  <text x="155" y="533" text-anchor="middle" fill="#64748b" font-size="9">CSV + .setup_output.txt</text>

  <rect x="340" y="478" width="220" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="450" y="503" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Rapports JSON/MD</text>
  <text x="450" y="520" text-anchor="middle" fill="#64748b" font-size="10">reports/run_TIMESTAMP/</text>
  <text x="450" y="533" text-anchor="middle" fill="#64748b" font-size="9">latest → symlink</text>

  <rect x="650" y="478" width="190" height="60" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="745" y="503" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">DuckDB</text>
  <text x="745" y="520" text-anchor="middle" fill="#64748b" font-size="10">results.db</text>
  <text x="745" y="533" text-anchor="middle" fill="#64748b" font-size="9">4 tables</text>

  <!-- Dashboard -->
  <line x1="155" y1="538" x2="350" y2="590" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#fa)"/>
  <line x1="450" y1="538" x2="450" y2="590" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#fa)"/>
  <line x1="745" y1="538" x2="550" y2="590" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#fa)"/>

  <text x="220" y="575" fill="#38bdf8" font-size="9">read_csv_auto()</text>
  <text x="465" y="575" fill="#38bdf8" font-size="9">JSON parse</text>
  <text x="650" y="575" fill="#38bdf8" font-size="9">SQL queries</text>

  <rect x="280" y="593" width="340" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="280" y="593" width="340" height="30" rx="10" fill="#38bdf8" opacity="0.15"/>
  <rect x="280" y="615" width="340" height="8" fill="#1e293b"/>
  <text x="450" y="615" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Dashboard (port 8080)</text>
  <text x="450" y="642" text-anchor="middle" fill="#e2e8f0" font-size="11">data.py fusionne les 3 sources</text>
  <text x="450" y="660" text-anchor="middle" fill="#64748b" font-size="10">Overview | Tests | Rapports | Comparer | Metriques | Admin</text>
</svg>
