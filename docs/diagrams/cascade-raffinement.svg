<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- os.walk -->
    <rect x="200" y="10" width="260" height="50" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="330" y="42" text-anchor="middle" font-size="13">🔍 os.walk() — parcours récursif</text>

    <line x1="330" y1="60" x2="330" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Has subdirs? -->
    <rect x="200" y="95" width="260" height="50" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="330" y="125" text-anchor="middle" font-size="13">Le dossier a des sous-dossiers ?</text>

    <!-- No = leaf → skip -->
    <line x1="465" y1="120" x2="540" y2="120" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="495" y="114" font-size="11" fill="#9ca3af">Non</text>
    <rect x="545" y="103" width="120" height="35" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="605" y="125" text-anchor="middle" font-size="12" fill="#9ca3af">⏭ Skip</text>

    <!-- Yes → collect PDFs -->
    <line x1="330" y1="145" x2="330" y2="175" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="163" font-size="11" fill="#6b7280">Oui</text>

    <rect x="200" y="180" width="260" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="330" y="210" text-anchor="middle" font-size="13" fill="#1e40af">📄 Collecter les PDF</text>

    <line x1="330" y1="230" x2="330" y2="255" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Raffiné box (tall, spans all 4 niveaux) -->
    <rect x="555" y="260" width="120" height="268" rx="14" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="615" y="390" text-anchor="middle" font-size="22">📂</text>
    <text x="615" y="412" text-anchor="middle" font-size="14" fill="#166534">Raffiné</text>

    <!-- Niveau 1 YAML -->
    <rect x="200" y="260" width="260" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Niveau 1 — Règles YAML</text>

    <line x1="465" y1="284" x2="550" y2="284" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="278" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="308" x2="330" y2="333" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="324" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 2 Nom sous-dossier -->
    <rect x="200" y="338" width="260" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Niveau 2 — Nom de sous-dossier</text>

    <line x1="465" y1="362" x2="550" y2="362" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="356" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="386" x2="330" y2="411" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="402" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 3 LLM texte -->
    <rect x="200" y="416" width="260" height="48" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="330" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Niveau 3 — LLM texte</text>

    <line x1="465" y1="440" x2="550" y2="440" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="434" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="464" x2="330" y2="487" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="479" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 4 Vision -->
    <rect x="200" y="492" width="260" height="48" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="330" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Niveau 4 — 👁 LLM Vision</text>

    <line x1="465" y1="516" x2="550" y2="516" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="510" font-size="11" fill="#22c55e">✓</text>

    <!-- non_classé -->
    <line x1="195" y1="516" x2="120" y2="516" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="510" font-size="11" fill="#ef4444">✗</text>
    <rect x="0" y="498" width="120" height="35" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="60" y="520" text-anchor="middle" font-size="12" fill="#dc2626">⚠ non_classé</text>
  </g>
</svg>
