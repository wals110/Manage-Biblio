<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- os.walk -->
    <rect x="200" y="10" width="260" height="50" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="330" y="42" text-anchor="middle" font-size="13">🔍 os.walk() — parcours récursif</text>

    <line x1="330" y1="60" x2="330" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Has subdirs? -->
    <rect x="215" y="95" width="230" height="45" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="330" y="123" text-anchor="middle" font-size="13">Le dossier a des sous-dossiers ?</text>

    <!-- No = leaf → skip -->
    <line x1="450" y1="117" x2="530" y2="117" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="480" y="111" font-size="11" fill="#9ca3af">Non</text>
    <rect x="535" y="100" width="100" height="35" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="585" y="123" text-anchor="middle" font-size="12" fill="#9ca3af">⏭ Skip</text>

    <!-- Yes → collect PDFs -->
    <line x1="330" y1="140" x2="330" y2="170" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="340" y="158" font-size="11" fill="#6b7280">Oui</text>

    <rect x="230" y="175" width="200" height="40" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="330" y="200" text-anchor="middle" font-size="13" fill="#1e40af">📄 Collecter les PDF</text>

    <line x1="330" y1="215" x2="330" y2="245" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Raffiné box (tall, spans all 4 niveaux) -->
    <rect x="555" y="250" width="115" height="270" rx="14" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="612" y="382" text-anchor="middle" font-size="22">📂</text>
    <text x="612" y="404" text-anchor="middle" font-size="14" fill="#166534">Raffiné</text>

    <!-- Niveau 1 YAML -->
    <rect x="200" y="250" width="260" height="45" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Niveau 1 — Règles YAML</text>

    <line x1="465" y1="272" x2="550" y2="272" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="266" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="295" x2="330" y2="320" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="311" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 2 Nom sous-dossier -->
    <rect x="200" y="325" width="260" height="45" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="330" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Niveau 2 — Nom de sous-dossier</text>

    <line x1="465" y1="347" x2="550" y2="347" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="341" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="370" x2="330" y2="395" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="386" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 3 LLM texte -->
    <rect x="200" y="400" width="260" height="45" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="330" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Niveau 3 — LLM texte</text>

    <line x1="465" y1="422" x2="550" y2="422" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="416" font-size="11" fill="#22c55e">✓</text>

    <line x1="330" y1="445" x2="330" y2="468" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="340" y="460" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 4 Vision -->
    <rect x="200" y="473" width="260" height="45" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="330" y="501" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Niveau 4 — 👁 LLM Vision</text>

    <line x1="465" y1="495" x2="550" y2="495" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="505" y="489" font-size="11" fill="#22c55e">✓</text>

    <!-- non_classé -->
    <line x1="200" y1="495" x2="110" y2="495" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="489" font-size="11" fill="#ef4444">✗</text>
    <rect x="15" y="478" width="100" height="35" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="65" y="500" text-anchor="middle" font-size="12" fill="#dc2626">⚠ non_classé</text>
  </g>
</svg>