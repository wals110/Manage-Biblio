<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="750" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Architecture des tests fonctionnels</text>
  <text x="550" y="55" text-anchor="middle" fill="#64748b" font-size="12">4 couches : Definition, Execution, Persistance, Visualisation</text>

  <!-- ═══ LAYER 1: DEFINITION ═══ -->
  <rect x="30" y="75" width="1040" height="130" rx="10" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="55" y="95" fill="#a78bfa" font-size="13" font-weight="700" opacity="0.7">DEFINITION</text>

  <!-- tests.yaml -->
  <rect x="60" y="110" width="280" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="60" y="110" width="280" height="28" rx="8" fill="#a78bfa" opacity="0.15"/>
  <rect x="60" y="130" width="280" height="8" fill="#1e293b"/>
  <text x="200" y="130" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">tests.yaml</text>
  <text x="200" y="152" text-anchor="middle" fill="#e2e8f0" font-size="11">11 phases | 45 series | 119 checks</text>
  <text x="200" y="168" text-anchor="middle" fill="#64748b" font-size="10">variables, dependances, assertions</text>
  <text x="200" y="182" text-anchor="middle" fill="#64748b" font-size="10">Source de verite unique</text>

  <!-- validate_tests.py -->
  <rect x="380" y="110" width="230" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="380" y="110" width="230" height="28" rx="8" fill="#fbbf24" opacity="0.15"/>
  <rect x="380" y="130" width="230" height="8" fill="#1e293b"/>
  <text x="495" y="130" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">validate_tests.py</text>
  <text x="495" y="152" text-anchor="middle" fill="#e2e8f0" font-size="11">10 regles de validation</text>
  <text x="495" y="168" text-anchor="middle" fill="#64748b" font-size="10">4 auto-fix | 3 warnings | 3 errors</text>
  <text x="495" y="182" text-anchor="middle" fill="#64748b" font-size="10">grep -c, -y, clean all, chemins</text>

  <!-- Skills -->
  <rect x="650" y="110" width="400" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="650" y="110" width="400" height="28" rx="8" fill="#38bdf8" opacity="0.15"/>
  <rect x="650" y="130" width="400" height="8" fill="#1e293b"/>
  <text x="850" y="130" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">Skills Claude Code</text>
  <text x="740" y="155" fill="#e2e8f0" font-size="10">Skill 1: test-plan</text>
  <text x="740" y="170" fill="#64748b" font-size="9">generate + update</text>
  <text x="870" y="155" fill="#e2e8f0" font-size="10">Skill 3: issues-sync</text>
  <text x="870" y="170" fill="#64748b" font-size="9">GitHub Projects</text>
  <text x="990" y="155" fill="#e2e8f0" font-size="10">Orchestrateur</text>
  <text x="990" y="170" fill="#64748b" font-size="9">routage auto</text>

  <!-- Arrow yaml → validate -->
  <line x1="340" y1="150" x2="378" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ LAYER 2: EXECUTION ═══ -->
  <rect x="30" y="225" width="1040" height="145" rx="10" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="55" y="245" fill="#4ade80" font-size="13" font-weight="700" opacity="0.7">EXECUTION</text>

  <!-- Runner -->
  <rect x="60" y="260" width="320" height="95" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="60" y="260" width="320" height="28" rx="8" fill="#4ade80" opacity="0.15"/>
  <rect x="60" y="280" width="320" height="8" fill="#1e293b"/>
  <text x="220" y="280" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">run_functional.py</text>
  <text x="220" y="302" text-anchor="middle" fill="#e2e8f0" font-size="11">Resolution variables + dependances</text>
  <text x="220" y="318" text-anchor="middle" fill="#e2e8f0" font-size="11">9 types d'assertions</text>
  <text x="220" y="334" text-anchor="middle" fill="#64748b" font-size="10">--phase --series --rerun-failures --label</text>
  <text x="220" y="348" text-anchor="middle" fill="#64748b" font-size="10">Logs structures + rapports JSON/MD</text>

  <!-- Klodo commands -->
  <rect x="440" y="260" width="160" height="95" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="520" y="290" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">klodo.sh</text>
  <text x="520" y="310" text-anchor="middle" fill="#e2e8f0" font-size="10">rename</text>
  <text x="520" y="325" text-anchor="middle" fill="#e2e8f0" font-size="10">classify</text>
  <text x="520" y="340" text-anchor="middle" fill="#e2e8f0" font-size="10">process / refine</text>

  <!-- Test data -->
  <rect x="660" y="260" width="390" height="95" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="855" y="285" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Jeu de donnees</text>
  <text x="855" y="308" text-anchor="middle" fill="#e2e8f0" font-size="11">BIBLIO-TEST-FUNC (SSD externe)</text>
  <text x="855" y="325" text-anchor="middle" fill="#e2e8f0" font-size="11">1000 PDFs : 925 propres + 75 sales</text>
  <text x="855" y="342" text-anchor="middle" fill="#64748b" font-size="10">flatten_to_inbox.sh pour reset</text>

  <!-- Arrow yaml → runner -->
  <line x1="200" y1="192" x2="200" y2="258" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow runner → klodo -->
  <line x1="380" y1="308" x2="438" y2="308" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- Arrow klodo → test data -->
  <line x1="600" y1="308" x2="658" y2="308" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ═══ LAYER 3: PERSISTANCE ═══ -->
  <rect x="30" y="390" width="1040" height="140" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="55" y="410" fill="#fbbf24" font-size="13" font-weight="700" opacity="0.7">PERSISTANCE</text>

  <!-- DuckDB -->
  <rect x="60" y="425" width="280" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="60" y="425" width="280" height="28" rx="8" fill="#fbbf24" opacity="0.15"/>
  <rect x="60" y="445" width="280" height="8" fill="#1e293b"/>
  <text x="200" y="445" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">DuckDB (results.db)</text>
  <text x="200" y="468" text-anchor="middle" fill="#e2e8f0" font-size="11">runs | series_results | check_results</text>
  <text x="200" y="484" text-anchor="middle" fill="#e2e8f0" font-size="11">manual_validations</text>
  <text x="200" y="500" text-anchor="middle" fill="#64748b" font-size="10">+ read_csv_auto() sur les CSV</text>

  <!-- JSON reports -->
  <rect x="380" y="425" width="230" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="495" y="453" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Rapports JSON/MD</text>
  <text x="495" y="475" text-anchor="middle" fill="#e2e8f0" font-size="11">reports/run_TIMESTAMP/</text>
  <text x="495" y="491" text-anchor="middle" fill="#e2e8f0" font-size="11">report.json + report.md</text>
  <text x="495" y="507" text-anchor="middle" fill="#64748b" font-size="10">latest → symlink</text>

  <!-- CSV logs -->
  <rect x="650" y="425" width="400" height="90" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="850" y="453" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Logs structures</text>
  <text x="850" y="475" text-anchor="middle" fill="#e2e8f0" font-size="11">logs/phase_N/T*.*/rapport_*.csv</text>
  <text x="850" y="491" text-anchor="middle" fill="#e2e8f0" font-size="11">rapport_classify, rapport_rename, refine</text>
  <text x="850" y="507" text-anchor="middle" fill="#64748b" font-size="10">.setup_output.txt, log_renommage_*.csv</text>

  <!-- Arrow runner → persistance -->
  <line x1="200" y1="357" x2="200" y2="423" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="357" x2="495" y2="423" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="357" x2="850" y2="423" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ═══ LAYER 4: VISUALISATION ═══ -->
  <rect x="30" y="550" width="1040" height="180" rx="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <text x="55" y="570" fill="#38bdf8" font-size="13" font-weight="700" opacity="0.7">VISUALISATION</text>

  <!-- Dashboard -->
  <rect x="60" y="585" width="1000" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="560" y="615" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Dashboard — FastAPI + Jinja2 + HTMX + Chart.js (port 8080)</text>

  <!-- Pages -->
  <g transform="translate(60, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">Overview</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">KPIs, heatmap</text>
  </g>
  <g transform="translate(180, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#4ade80" opacity="0.15" stroke="#4ade80" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">Tests</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">run, monitor, valider</text>
  </g>
  <g transform="translate(300, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Rapports</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">CSV viewer</text>
  </g>
  <g transform="translate(420, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Comparer</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">diff entre runs</text>
  </g>
  <g transform="translate(540, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">Metriques</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">Chart.js, DuckDB</text>
  </g>
  <g transform="translate(660, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#64748b" opacity="0.3" stroke="#64748b" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Historique</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">timeline, trends</text>
  </g>
  <g transform="translate(780, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#64748b" opacity="0.3" stroke="#64748b" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Suggestions</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">LLM Mapper</text>
  </g>
  <g transform="translate(900, 645)">
    <rect x="0" y="0" width="110" height="35" rx="6" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="1"/>
    <text x="55" y="15" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">Admin</text>
    <text x="55" y="28" text-anchor="middle" fill="#64748b" font-size="8">API keys, cleanup</text>
  </g>

  <!-- Arrows persistance → dashboard -->
  <line x1="200" y1="517" x2="300" y2="583" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="495" y1="517" x2="500" y2="583" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="850" y1="517" x2="750" y2="583" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Labels on arrows -->
  <text x="220" y="555" fill="#38bdf8" font-size="9" opacity="0.7">SQL queries</text>
  <text x="500" y="555" fill="#38bdf8" font-size="9" opacity="0.7">JSON parse</text>
  <text x="770" y="555" fill="#38bdf8" font-size="9" opacity="0.7">read_csv_auto()</text>
</svg>
