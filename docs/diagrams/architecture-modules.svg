    <text x="497" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#5b21b6">constants.py</text>
    <text x="497" y="332" text-anchor="middle" font-size="10" fill="#7c3aed">Seuils, timeouts</text>

