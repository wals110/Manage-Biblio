<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 160" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- Passe 1 -->
    <rect x="15" y="15" width="290" height="120" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Passe 1 — Instantanée</text>

    <rect x="30" y="50" width="120" height="35" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="73" text-anchor="middle" font-size="12" fill="#1e40af">os.walk()</text>

    <line x1="155" y1="67" x2="175" y2="67" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="180" y="45" width="110" height="35" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="235" y="67" text-anchor="middle" font-size="12" fill="#1e40af">Règles YAML</text>

    <line x1="235" y1="80" x2="235" y2="95" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="170" y="95" width="120" height="30" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="230" y="115" text-anchor="middle" font-size="12" fill="#1e40af">Nom sous-dossier</text>

    <!-- Arrow between passes -->
    <line x1="310" y1="75" x2="380" y2="75" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="345" y="68" text-anchor="middle" font-size="11" fill="#6b7280">non_classé</text>

    <!-- Passe 2 -->
    <rect x="385" y="15" width="290" height="120" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="530" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">Passe 2 — Parallèle</text>

    <rect x="400" y="50" width="140" height="35" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="470" y="72" text-anchor="middle" font-size="12" fill="#5b21b6">ThreadPoolExecutor</text>

    <line x1="545" y1="67" x2="565" y2="67" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="405" y="95" width="100" height="30" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="455" y="115" text-anchor="middle" font-size="12" fill="#5b21b6">LLM texte</text>

    <line x1="510" y1="110" x2="540" y2="110" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="545" y="95" width="115" height="30" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="602" y="115" text-anchor="middle" font-size="12" fill="#5b21b6">Escalade Vision</text>
  </g>
</svg>