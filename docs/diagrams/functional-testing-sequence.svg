  <text x="1220" y="50" text-anchor="middle" fill="#64748b" font-size="9">Issues + Project</text>
  <line x1="1220" y1="90" x2="1220" y2="1380" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase A : Génération du cahier     -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="105" width="1270" height="20" rx="4" fill="#a78bfa" opacity="0.08"/>
  <text x="25" y="119" fill="#a78bfa" font-size="10" font-weight="700">PHASE A — Génération</text>

  <!-- 1. Dev → Skill 1 : /functional-testing -->
  <line x1="90" y1="140" x2="245" y2="140" stroke="#a78bfa" stroke-width="1.5"/>
  <polygon points="245,136 253,140 245,144" fill="#a78bfa"/>
  <text x="170" y="135" text-anchor="middle" fill="#e2e8f0" font-size="10">/functional-testing</text>

  <!-- 2. Skill 1 activation bar -->
  <rect x="245" y="140" width="10" height="60" rx="2" fill="#a78bfa" opacity="0.4"/>

  <!-- 3. Skill 1 self: explore projet -->
  <path d="M 255 155 Q 290 155 290 165 Q 290 175 255 175" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <text x="295" y="168" fill="#64748b" font-size="9">Explore klodo.py, README, tree.yaml, inventory.yaml</text>

  <!-- 4. Skill 1 → return: tests.yaml + CAHIER.md -->
  <line x1="245" y1="200" x2="95" y2="200" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,196 87,200 95,204" fill="#a78bfa"/>
  <text x="170" y="195" text-anchor="middle" fill="#e2e8f0" font-size="10">tests.yaml + CAHIER.md</text>

  <!-- 5. Dev → Validateur -->
  <line x1="90" y1="230" x2="395" y2="230" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="395,226 403,230 395,234" fill="#fbbf24"/>
  <text x="240" y="225" text-anchor="middle" fill="#e2e8f0" font-size="10">validate_tests.py fix</text>

  <!-- Validateur activation -->
  <rect x="395" y="230" width="10" height="40" rx="2" fill="#fbbf24" opacity="0.4"/>

  <!-- Validateur self: 10 rules -->
  <path d="M 405 245 Q 440 245 440 255 Q 440 265 405 265" fill="none" stroke="#fbbf24" stroke-width="1"/>
  <text x="445" y="258" fill="#64748b" font-size="9">10 règles : grep-c, -y, clean, paths... auto-fix</text>

  <!-- Validateur → return -->
  <line x1="395" y1="275" x2="95" y2="275" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,271 87,275 95,279" fill="#fbbf24"/>
  <text x="240" y="270" text-anchor="middle" fill="#e2e8f0" font-size="10">0 errors, 5 warnings</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase B : Création issues GitHub   -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="295" width="1270" height="20" rx="4" fill="#fbbf24" opacity="0.08"/>
  <text x="25" y="309" fill="#fbbf24" font-size="10" font-weight="700">PHASE B — GitHub Issues</text>

  <!-- Dev → GitHub : test-issues-sync create -->
  <line x1="90" y1="330" x2="1215" y2="330" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="1215,326 1223,330 1215,334" fill="#fbbf24"/>
  <text x="650" y="325" text-anchor="middle" fill="#e2e8f0" font-size="10">/test-issues-sync → crée 40 issues + Project board</text>

  <!-- GitHub → return -->
  <line x1="1215" y1="355" x2="95" y2="355" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,351 87,355 95,359" fill="#fbbf24"/>
  <text x="650" y="350" text-anchor="middle" fill="#e2e8f0" font-size="10">github_issue: N écrit dans tests.yaml</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase C : Exécution des tests      -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="375" width="1270" height="20" rx="4" fill="#4ade80" opacity="0.08"/>
  <text x="25" y="389" fill="#4ade80" font-size="10" font-weight="700">PHASE C — Exécution</text>

  <!-- Dev to Runner : run all label baseline -->
  <line x1="90" y1="410" x2="555" y2="410" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="555,406 563,410 555,414" fill="#4ade80"/>
  <text x="320" y="405" text-anchor="middle" fill="#e2e8f0" font-size="10">run_functional.py label "baseline-v1"</text>

  <!-- Runner activation bar (long) -->
  <rect x="555" y="410" width="10" height="330" rx="2" fill="#4ade80" opacity="0.3"/>

  <!-- Runner: session.pre_run -->
  <path d="M 565 425 Q 600 425 600 435 Q 600 445 565 445" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="605" y="438" fill="#64748b" font-size="9">session.pre_run : flatten + clean progress</text>

  <!-- Runner → Klodo : classify -->
  <line x1="565" y1="470" x2="725" y2="470" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="725,466 733,470 725,474" fill="#38bdf8"/>
  <text x="645" y="465" text-anchor="middle" fill="#e2e8f0" font-size="10">setup: klodo.sh classify -y --max 30</text>

  <!-- Klodo activation -->
  <rect x="725" y="470" width="10" height="40" rx="2" fill="#38bdf8" opacity="0.4"/>

  <!-- Klodo self: classify files -->
  <path d="M 735 480 Q 770 480 770 490 Q 770 500 735 500" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <text x="775" y="493" fill="#64748b" font-size="9">Classification LLM (SiliconFlow API)</text>

  <!-- Klodo → return rapport CSV -->
  <line x1="725" y1="515" x2="570" y2="515" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="570,511 562,515 570,519" fill="#38bdf8"/>
  <text x="645" y="510" text-anchor="middle" fill="#e2e8f0" font-size="10">rapport_classify_*.csv</text>

  <!-- Runner: evaluate assertions -->
  <path d="M 565 535 Q 600 535 600 545 Q 600 555 565 555" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="605" y="548" fill="#64748b" font-size="9">Évaluer 9 types d'assertion (output_equals, file_exists...)</text>

  <!-- Runner: check result dots -->
  <text x="605" y="575" fill="#4ade80" font-size="9">T2.1a ✓ PASS — T2.1b ✓ PASS — T2.1c ✓ PASS</text>

  <!-- Runner: move logs -->
  <path d="M 565 590 Q 600 590 600 600 Q 600 610 565 610" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="605" y="603" fill="#64748b" font-size="9">Déplacer logs → tests/functional/logs/phase_2/T2.1/</text>

  <!-- Runner: next series -->
  <text x="605" y="630" fill="#64748b" font-size="9" font-style="italic">...répéter pour chaque série de chaque phase...</text>

  <!-- Runner → DuckDB : insert -->
  <line x1="565" y1="660" x2="895" y2="660" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="895,656 903,660 895,664" fill="#f87171"/>
  <text x="730" y="655" text-anchor="middle" fill="#e2e8f0" font-size="10">INSERT run + series + checks</text>

  <!-- DuckDB activation -->
  <rect x="895" y="660" width="10" height="25" rx="2" fill="#f87171" opacity="0.4"/>
  <text x="910" y="678" fill="#64748b" font-size="9">"baseline-v1" + git branch + commit</text>

  <!-- Runner: write report -->
  <path d="M 565 700 Q 600 700 600 710 Q 600 720 565 720" fill="none" stroke="#4ade80" stroke-width="1"/>
  <text x="605" y="713" fill="#64748b" font-size="9">Écrire reports/run_20260408/report.json + report.md</text>

  <!-- Runner → Dev : return -->
  <line x1="555" y1="745" x2="95" y2="745" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,741 87,745 95,749" fill="#4ade80"/>
  <text x="320" y="740" text-anchor="middle" fill="#e2e8f0" font-size="10">104 PASS | 1 FAIL | 18 SKIP — baseline-v1 (swift-dune)</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase D : Dashboard                -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="765" width="1270" height="20" rx="4" fill="#f87171" opacity="0.08"/>
  <text x="25" y="779" fill="#f87171" font-size="10" font-weight="700">PHASE D — Visualisation</text>

  <!-- Dev → Dashboard : open -->
  <line x1="90" y1="800" x2="1055" y2="800" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="1055,796 1063,800 1055,804" fill="#f87171"/>
  <text x="570" y="795" text-anchor="middle" fill="#e2e8f0" font-size="10">./klodo.sh dashboard → http://localhost:8080</text>

  <!-- Dashboard → DuckDB : query -->
  <line x1="1055" y1="825" x2="905" y2="825" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="905,821 897,825 905,829" fill="#f87171"/>
  <text x="980" y="820" text-anchor="middle" fill="#e2e8f0" font-size="10">SELECT * FROM runs</text>

  <!-- DuckDB → Dashboard : data -->
  <line x1="905" y1="845" x2="1055" y2="845" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="1055,841 1063,845 1055,849" fill="#f87171"/>
  <text x="980" y="840" text-anchor="middle" fill="#64748b" font-size="9">runs + series + checks</text>

  <!-- Dashboard → Dev : pages -->
  <line x1="1055" y1="870" x2="95" y2="870" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,866 87,870 95,874" fill="#f87171"/>
  <text x="570" y="865" text-anchor="middle" fill="#e2e8f0" font-size="10">Overview | Tests | Rapports | Comparer | Métriques | Historique | Admin</text>

  <!-- Dev → Dashboard : run test from UI -->
  <line x1="90" y1="900" x2="1055" y2="900" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="1055,896 1063,900 1055,904" fill="#4ade80"/>
  <text x="570" y="895" text-anchor="middle" fill="#e2e8f0" font-size="10">▶ Run T0.1 (click dans le dashboard)</text>

  <!-- Dashboard → Runner : POST /api/run -->
  <line x1="1055" y1="920" x2="565" y2="920" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="565,916 557,920 565,924" fill="#4ade80"/>
  <text x="810" y="915" text-anchor="middle" fill="#64748b" font-size="9">POST /api/run?series=T0.1</text>

  <!-- Dashboard polling -->
  <line x1="1055" y1="940" x2="900" y2="940" stroke="#f87171" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="980" y="937" text-anchor="middle" fill="#64748b" font-size="8">GET /api/status (poll 2s)</text>
  <line x1="900" y1="950" x2="1055" y2="950" stroke="#f87171" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="980" y="960" text-anchor="middle" fill="#64748b" font-size="8">{running: true, current_series: "T0.1"}</text>

  <!-- Dashboard: dot blue → green -->
  <text x="1070" y="980" fill="#4ade80" font-size="9">● T0.1 bleu → vert (PASS)</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase E : GitHub Sync              -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="1000" width="1270" height="20" rx="4" fill="#fbbf24" opacity="0.08"/>
  <text x="25" y="1014" fill="#fbbf24" font-size="10" font-weight="700">PHASE E — Sync GitHub</text>

  <!-- Dashboard → GitHub : close issue -->
  <line x1="1060" y1="1035" x2="1215" y2="1035" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="1215,1031 1223,1035 1215,1039" fill="#fbbf24"/>
  <text x="1140" y="1030" text-anchor="middle" fill="#e2e8f0" font-size="10">gh issue close #89</text>
  <text x="1140" y="1050" text-anchor="middle" fill="#64748b" font-size="9">+ commentaire "PASS — baseline-v1"</text>

  <!-- GitHub → Dashboard : updated -->
  <line x1="1215" y1="1065" x2="1065" y2="1065" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="1065,1061 1057,1065 1065,1069" fill="#fbbf24"/>
  <text x="1140" y="1078" text-anchor="middle" fill="#64748b" font-size="9">Issue fermée ✓</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase F : Itération 2              -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="1100" width="1270" height="20" rx="4" fill="#e2e8f0" opacity="0.05"/>
  <text x="25" y="1114" fill="#e2e8f0" font-size="10" font-weight="700">PHASE F — Itération 2 (code a changé)</text>

  <!-- Dev: code change -->
  <path d="M 90 1140 Q 125 1140 125 1150 Q 125 1160 90 1160" fill="none" stroke="#a78bfa" stroke-width="1"/>
  <text x="130" y="1153" fill="#64748b" font-size="9">git commit "refactor classifier" sur feature/refactor</text>

  <!-- Dev → Runner : run with label -->
  <line x1="90" y1="1180" x2="555" y2="1180" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="555,1176 563,1180 555,1184" fill="#4ade80"/>
  <text x="320" y="1175" text-anchor="middle" fill="#e2e8f0" font-size="10">run_functional.py label "après-refactor"</text>

  <!-- Runner activation -->
  <rect x="555" y="1180" width="10" height="50" rx="2" fill="#4ade80" opacity="0.3"/>

  <!-- Runner → DuckDB -->
  <line x1="565" y1="1210" x2="895" y2="1210" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="895,1206 903,1210 895,1214" fill="#f87171"/>
  <text x="730" y="1205" text-anchor="middle" fill="#64748b" font-size="9">INSERT "après-refactor" [feature/refactor@3a8f1c2]</text>

  <!-- Runner → Dev : return -->
  <line x1="555" y1="1235" x2="95" y2="1235" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,1231 87,1235 95,1239" fill="#4ade80"/>
  <text x="320" y="1230" text-anchor="middle" fill="#e2e8f0" font-size="10">108 PASS | 0 FAIL | 15 SKIP — après-refactor (cosmic-panda)</text>

  <!-- Dev → Dashboard : compare -->
  <line x1="90" y1="1265" x2="1055" y2="1265" stroke="#f87171" stroke-width="1.5"/>
  <polygon points="1055,1261 1063,1265 1055,1269" fill="#f87171"/>
  <text x="570" y="1260" text-anchor="middle" fill="#e2e8f0" font-size="10">Comparer "baseline-v1" vs "après-refactor"</text>

  <!-- Dashboard → DuckDB : query both -->
  <line x1="1055" y1="1285" x2="905" y2="1285" stroke="#f87171" stroke-width="1"/>
  <text x="980" y="1282" text-anchor="middle" fill="#64748b" font-size="8">SELECT FROM series_results WHERE run_id IN (...)</text>

  <!-- Dashboard → Dev : diff -->
  <line x1="1055" y1="1305" x2="95" y2="1305" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,1301 87,1305 95,1309" fill="#f87171"/>
  <text x="570" y="1300" text-anchor="middle" fill="#e2e8f0" font-size="10">+4 PASS | -1 FAIL | Δ rate +4.5% | 3 régressions détectées</text>

  <!-- ═══════════════════════════════════ -->
  <!--  Phase G : Release                  -->
  <!-- ═══════════════════════════════════ -->
  <rect x="15" y="1325" width="1270" height="20" rx="4" fill="#4ade80" opacity="0.08"/>
  <text x="25" y="1339" fill="#4ade80" font-size="10" font-weight="700">PHASE G — Release</text>

  <!-- Dev → GitHub : check release gate -->
  <line x1="90" y1="1360" x2="1215" y2="1360" stroke="#4ade80" stroke-width="1.5"/>
  <polygon points="1215,1356 1223,1360 1215,1364" fill="#4ade80"/>
  <text x="650" y="1355" text-anchor="middle" fill="#e2e8f0" font-size="10">Toutes issues fermées ? → ✓ READY TO RELEASE → git tag v1.0.0</text>

  <!-- CI release -->
  <line x1="1215" y1="1375" x2="95" y2="1375" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="4,4"/>
  <polygon points="95,1371 87,1375 95,1379" fill="#4ade80"/>
  <text x="650" y="1390" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">CI release.yml → tests ✓ + lint ✓ → GitHub Release créée</text>

</svg>
