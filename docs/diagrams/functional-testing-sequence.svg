<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1400" font-family="system-ui, -apple-system, sans-serif">

  <!-- Background -->
  <rect width="1300" height="1400" fill="#0f172a" rx="12"/>

  <!-- Title -->
  <text x="650" y="30" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Diagramme de séquence — Tests Fonctionnels</text>

  <!-- ═══ Actors (lifelines) ═══ -->
  <!-- Developer -->
  <rect x="40" y="55" width="100" height="35" rx="6" fill="#a78bfa" opacity="0.2" stroke="#a78bfa"/>
