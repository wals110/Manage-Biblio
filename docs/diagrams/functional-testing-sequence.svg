  <line x1="90" y1="90" x2="90" y2="1380" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Skill 1 -->
  <rect x="200" y="55" width="100" height="35" rx="6" fill="#a78bfa" opacity="0.2" stroke="#a78bfa"/>
  <text x="250" y="77" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">Skill 1</text>
  <text x="250" y="50" text-anchor="middle" fill="#64748b" font-size="9">test-plan</text>
  <line x1="250" y1="90" x2="250" y2="1380" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Validateur -->
  <rect x="350" y="55" width="100" height="35" rx="6" fill="#fbbf24" opacity="0.2" stroke="#fbbf24"/>
  <text x="400" y="77" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Validateur</text>
  <line x1="400" y1="90" x2="400" y2="1380" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Runner -->
  <rect x="510" y="55" width="100" height="35" rx="6" fill="#4ade80" opacity="0.2" stroke="#4ade80"/>
