  <text x="560" y="50" text-anchor="middle" fill="#64748b" font-size="9">run_functional.py</text>
  <line x1="560" y1="90" x2="560" y2="1380" stroke="#4ade80" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Klodo CLI -->
  <rect x="680" y="55" width="100" height="35" rx="6" fill="#38bdf8" opacity="0.2" stroke="#38bdf8"/>
  <text x="730" y="77" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">Klodo CLI</text>
  <text x="730" y="50" text-anchor="middle" fill="#64748b" font-size="9">klodo.sh</text>
  <line x1="730" y1="90" x2="730" y2="1380" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- DuckDB -->
  <rect x="850" y="55" width="100" height="35" rx="6" fill="#f87171" opacity="0.2" stroke="#f87171"/>
  <text x="900" y="77" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">DuckDB</text>
  <text x="900" y="50" text-anchor="middle" fill="#64748b" font-size="9">results.db</text>
  <line x1="900" y1="90" x2="900" y2="1380" stroke="#f87171" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Dashboard -->
  <rect x="1010" y="55" width="100" height="35" rx="6" fill="#f87171" opacity="0.2" stroke="#f87171"/>
  <text x="1060" y="77" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">Dashboard</text>
  <text x="1060" y="50" text-anchor="middle" fill="#64748b" font-size="9">FastAPI</text>
  <line x1="1060" y1="90" x2="1060" y2="1380" stroke="#f87171" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>

