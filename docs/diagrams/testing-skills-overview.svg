<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="sa" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#0f172a" rx="12"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Skills Claude Code — tests fonctionnels</text>

  <!-- Orchestrator -->
  <rect x="250" y="55" width="400" height="120" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="250" y="55" width="400" height="32" rx="10" fill="#38bdf8" opacity="0.15"/>
  <rect x="250" y="79" width="400" height="8" fill="#1e293b"/>
  <text x="450" y="77" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">functional-testing (orchestrateur)</text>
  <text x="270" y="105" fill="#e2e8f0" font-size="11">Detecte l'etat du projet et route :</text>
  <text x="270" y="123" fill="#64748b" font-size="10">"genere le cahier" → Skill 1 (GENERATE)</text>
  <text x="270" y="138" fill="#64748b" font-size="10">"mets a jour" → Skill 1 (UPDATE)</text>
  <text x="270" y="153" fill="#64748b" font-size="10">"lance les tests" → runner directement</text>
  <text x="270" y="168" fill="#64748b" font-size="10">"sync issues" → Skill 3</text>

  <!-- Skill 1 -->
  <rect x="40" y="220" width="380" height="200" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <rect x="40" y="220" width="380" height="32" rx="10" fill="#4ade80" opacity="0.15"/>
  <rect x="40" y="244" width="380" height="8" fill="#1e293b"/>
  <text x="230" y="242" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">functional-test-plan (Skill 1)</text>

  <rect x="60" y="262" width="160" height="70" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
  <text x="140" y="282" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">GENERATE</text>
  <text x="140" y="298" text-anchor="middle" fill="#e2e8f0" font-size="9">Analyse projet</text>
  <text x="140" y="312" text-anchor="middle" fill="#e2e8f0" font-size="9">Genere from scratch</text>
  <text x="140" y="326" text-anchor="middle" fill="#64748b" font-size="9">Preserve custom: only</text>

  <rect x="240" y="262" width="160" height="70" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="320" y="282" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">UPDATE</text>
  <text x="320" y="298" text-anchor="middle" fill="#e2e8f0" font-size="9">Inventorie l'existant</text>
  <text x="320" y="312" text-anchor="middle" fill="#e2e8f0" font-size="9">Analyse les gaps</text>
  <text x="320" y="326" text-anchor="middle" fill="#64748b" font-size="9">Ajoute A LA FIN</text>

  <text x="230" y="355" text-anchor="middle" fill="#e2e8f0" font-size="10">Produit : tests.yaml + CAHIER.md</text>
  <text x="230" y="372" text-anchor="middle" fill="#64748b" font-size="9">Passe le validateur (10 regles)</text>

  <rect x="60" y="385" width="340" height="25" rx="4" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="1"/>
  <text x="230" y="402" text-anchor="middle" fill="#f87171" font-size="10">UPDATE : ne modifie JAMAIS les IDs existants</text>

  <!-- Skill 3 -->
  <rect x="480" y="220" width="380" height="120" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="480" y="220" width="380" height="32" rx="10" fill="#fbbf24" opacity="0.15"/>
  <rect x="480" y="244" width="380" height="8" fill="#1e293b"/>
  <text x="670" y="242" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">test-issues-sync (Skill 3)</text>
  <text x="500" y="270" fill="#e2e8f0" font-size="11">Synchronise tests.yaml ↔ GitHub</text>
  <text x="500" y="290" fill="#e2e8f0" font-size="11">1 issue par serie (40+ issues)</text>
  <text x="500" y="310" fill="#e2e8f0" font-size="11">Fermeture auto en mode --interactive</text>
  <text x="500" y="330" fill="#64748b" font-size="10">Project board "Tests Fonctionnels - Klodo"</text>

  <!-- Skill 2 retired -->
  <rect x="480" y="360" width="380" height="55" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="670" y="385" text-anchor="middle" fill="#64748b" font-size="12">functional-test-runner (Skill 2)</text>
  <text x="670" y="403" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">RETIRE le 2026-04-10</text>

  <!-- Arrows -->
  <line x1="350" y1="175" x2="230" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#sa)"/>
  <line x1="550" y1="175" x2="670" y2="218" stroke="#64748b" stroke-width="1.5" marker-end="url(#sa)"/>
</svg>
