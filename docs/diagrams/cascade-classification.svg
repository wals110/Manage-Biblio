<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- PDF -->
    <rect x="250" y="10" width="160" height="50" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="330" y="42" text-anchor="middle" font-size="14">📄 PDF</text>

    <line x1="330" y1="60" x2="330" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- LLM Vision -->
    <rect x="220" y="85" width="200" height="50" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="115" text-anchor="middle" font-size="13">🤖 LLM Vision — couverture</text>

    <line x1="330" y1="135" x2="330" y2="165" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Classé box (tall, spans all levels) -->
    <rect x="540" y="170" width="120" height="220" rx="14" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="600" y="278" text-anchor="middle" font-size="22">📂</text>
    <text x="600" y="300" text-anchor="middle" font-size="14" fill="#166534">Classé</text>

    <!-- Niveau 1 : Theme Mapping -->
    <rect x="190" y="170" width="260" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">1. Theme Mapping</text>
    <text x="320" y="208" text-anchor="middle" font-size="11" fill="#3b82f6">355+ entrées — instantané — gratuit</text>

    <!-- Success arrow to Classé -->
    <line x1="455" y1="194" x2="535" y2="194" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="490" y="188" font-size="11" fill="#22c55e">✓</text>

    <!-- Fail arrow down -->
    <line x1="320" y1="218" x2="320" y2="248" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="330" y="237" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 2 : Keyword Matcher -->
    <rect x="190" y="253" width="260" height="48" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="320" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">2. Keyword Matcher</text>
    <text x="320" y="291" text-anchor="middle" font-size="11" fill="#3b82f6">titre + thème + filename — TF-IDF</text>

    <line x1="455" y1="277" x2="535" y2="277" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="490" y="271" font-size="11" fill="#22c55e">✓</text>

    <line x1="320" y1="301" x2="320" y2="331" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="330" y="320" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 3 : LLM Mapper -->
    <rect x="190" y="336" width="260" height="48" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">3. LLM Mapper</text>
    <text x="320" y="374" text-anchor="middle" font-size="11" fill="#8b5cf6">texte + escalade vision + auto-apprentissage</text>

    <line x1="455" y1="360" x2="535" y2="360" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="490" y="354" font-size="11" fill="#22c55e">✓</text>

    <line x1="320" y1="384" x2="320" y2="414" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="330" y="403" font-size="11" fill="#ef4444">✗</text>

    <!-- Niveau 4 : Suggestion -->
    <rect x="220" y="419" width="200" height="48" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">4. Suggestion</text>
    <text x="320" y="457" text-anchor="middle" font-size="11" fill="#b45309">💡 review humain</text>
  </g>
</svg>