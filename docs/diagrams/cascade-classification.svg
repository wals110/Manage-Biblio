<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" font-family="Segoe Print, Comic Sans MS, cursive" font-size="13">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
  </defs>

  <g filter="url(#h)">
    <!-- PDF -->
    <rect x="370" y="10" width="260" height="50" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="500" y="42" text-anchor="middle" font-size="14">📄 PDF</text>
    <line x1="500" y1="60" x2="500" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- LLM Vision -->
    <rect x="370" y="85" width="260" height="50" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="500" y="108" text-anchor="middle" font-size="13">🤖 LLM Vision — couverture</text>
    <text x="500" y="125" text-anchor="middle" font-size="10" fill="#7c3aed">→ titre, thème, themes[], confidence</text>

    <line x1="500" y1="135" x2="500" y2="165" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Classé box (tall, spans all levels) -->
    <rect x="780" y="170" width="160" height="320" rx="14" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="860" y="328" text-anchor="middle" font-size="36">📂</text>
    <text x="860" y="358" text-anchor="middle" font-size="16" fill="#166534" font-weight="bold">Classé</text>
    <text x="860" y="378" text-anchor="middle" font-size="11" fill="#166534">→ /BIBLIO/dossier-cible/</text>

    <!-- ── Niveau 1 : Theme Mapping ── -->
    <rect x="370" y="170" width="260" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">1. Theme Mapping</text>
    <text x="500" y="208" text-anchor="middle" font-size="11" fill="#3b82f6">classify_by_theme() — instantané, gratuit</text>

    <!-- Trigger conditionnel : si N1 atterrit sur /Autres → challenge N3 -->
    <path d="M 630 215 Q 735 285 630 355" stroke="#f97316" stroke-width="1.8" fill="none"
          stroke-dasharray="5,3" marker-end="url(#arrowOrange)"/>
    <text x="715" y="238" font-size="10" fill="#c2410c" font-style="italic" text-anchor="middle">catch-all</text>
    <text x="715" y="251" font-size="10" fill="#c2410c" font-style="italic" text-anchor="middle">→ challenge N3</text>
    <text x="715" y="328" font-size="10" fill="#c2410c" font-style="italic" text-anchor="middle">~12% fichiers</text>
    <text x="715" y="341" font-size="10" fill="#c2410c" font-style="italic" text-anchor="middle">6% upgradés</text>

    <!-- YAML file box LEFT: theme_mapping.yaml -->
    <rect x="60" y="170" width="220" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="170" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">📋 theme_mapping.yaml</text>
    <text x="170" y="207" text-anchor="middle" font-size="10" fill="#a16207">355+ entrées — thème → dossier</text>
    <line x1="280" y1="195" x2="365" y2="195" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="322" y="186" font-size="10" fill="#a16207" text-anchor="middle">lit</text>

    <!-- Success arrow Niveau 1 to Classé -->
    <line x1="635" y1="194" x2="775" y2="194" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="703" y="186" font-size="11" fill="#22c55e" text-anchor="middle">✓ trouvé</text>

    <line x1="500" y1="220" x2="500" y2="248" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="513" y="237" font-size="11" fill="#ef4444">✗</text>

    <!-- ── Niveau 2 : Keyword Classifier ── -->
    <rect x="370" y="253" width="260" height="50" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="500" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">2. Keyword Classifier</text>
    <text x="500" y="291" text-anchor="middle" font-size="11" fill="#3b82f6">titre + thème + filename — mots-clés</text>

    <!-- YAML file box LEFT: categories.yaml -->
    <rect x="60" y="253" width="220" height="50" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="170" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#854d0e">📋 categories.yaml</text>
    <text x="170" y="290" text-anchor="middle" font-size="10" fill="#a16207">mots-clés par dossier (fallback)</text>
    <line x1="280" y1="278" x2="365" y2="278" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="322" y="269" font-size="10" fill="#a16207" text-anchor="middle">lit</text>

    <line x1="635" y1="277" x2="775" y2="277" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="703" y="269" font-size="11" fill="#22c55e" text-anchor="middle">✓ trouvé</text>

    <line x1="500" y1="303" x2="500" y2="331" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="513" y="320" font-size="11" fill="#ef4444">✗</text>

    <!-- ── Niveau 3 : LLM Mapper ── -->
    <rect x="370" y="336" width="260" height="50" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="500" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">3. LLM Mapper</text>
    <text x="500" y="374" text-anchor="middle" font-size="11" fill="#8b5cf6">appel LLM texte + escalade vision</text>

    <!-- Auto-apprentissage : flèche écriture vers theme_mapping.yaml -->
    <path d="M 370 360 Q 260 360 260 230 L 260 220" stroke="#f97316" stroke-width="2" fill="none"
          stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
    <text x="180" y="290" font-size="10" fill="#c2410c" font-style="italic">auto-apprentissage</text>
    <text x="180" y="304" font-size="10" fill="#c2410c" font-style="italic">(écriture)</text>

    <line x1="635" y1="360" x2="775" y2="360" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="703" y="352" font-size="11" fill="#22c55e" text-anchor="middle">✓ trouvé</text>

    <line x1="500" y1="386" x2="500" y2="414" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
    <text x="513" y="403" font-size="11" fill="#ef4444">✗</text>

    <!-- ── Niveau 4 : Suggestion ── -->
    <rect x="370" y="419" width="260" height="50" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="500" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">4. Suggestion humaine</text>
    <text x="500" y="457" text-anchor="middle" font-size="11" fill="#b45309">💡 logs/suggestions.yaml</text>

    <!-- ── Dashboard Taxonomie (écriture manuelle) ── -->
    <rect x="60" y="510" width="880" height="40" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="500" y="528" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">🎛 Dashboard Taxonomie — édition manuelle (drag-drop / + Mapper)</text>
    <text x="500" y="544" text-anchor="middle" font-size="10" fill="#be185d">écrit theme_mapping.yaml · backup auto dans .cache/taxonomy-backups/*.yaml (rotation 20)</text>
    <!-- Arrow from dashboard to theme_mapping.yaml -->
    <path d="M 170 510 L 170 220" stroke="#ec4899" stroke-width="1.5" fill="none"
          stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="578" text-anchor="middle" font-size="10" fill="#64748b" font-style="italic">⚠ Raffinements mai 2026 absents du schéma : refine_to_subfolder (N1) et fallback bas confiance (P4) — voir docs/classification.md</text>
</svg>
