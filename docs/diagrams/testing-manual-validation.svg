<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aw" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#0f172a" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Validation manuelle — cycle de vie</text>
  <text x="450" y="55" text-anchor="middle" fill="#64748b" font-size="12">Du mode auto (SKIP) a la validation dashboard (PASS/FAIL) avec option de revision</text>

  <!-- State 1: Auto mode -->
  <rect x="40" y="90" width="240" height="140" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="40" y="90" width="240" height="30" rx="10" fill="#fbbf24" opacity="0.15"/>
  <rect x="40" y="112" width="240" height="8" fill="#1e293b"/>
  <text x="160" y="112" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">1. Mode auto</text>
  <text x="160" y="140" text-anchor="middle" fill="#e2e8f0" font-size="11">Le runner execute le test</text>
  <text x="160" y="160" text-anchor="middle" fill="#e2e8f0" font-size="11">mode: manual_check detecte</text>
  <text x="160" y="185" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700">Status : SKIP</text>
  <text x="160" y="205" text-anchor="middle" fill="#64748b" font-size="10">detail: "Manual check"</text>
  <circle cx="57" cy="160" r="8" fill="#fbbf24" opacity="0.6"/>

  <!-- Arrow 1→2 -->
  <line x1="280" y1="160" x2="340" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#aw)"/>
  <text x="310" y="150" text-anchor="middle" fill="#64748b" font-size="9">Page Tests</text>

  <!-- State 2: Dashboard widget -->
  <rect x="345" y="90" width="240" height="140" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="345" y="90" width="240" height="30" rx="10" fill="#38bdf8" opacity="0.15"/>
  <rect x="345" y="112" width="240" height="8" fill="#1e293b"/>
  <text x="465" y="112" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="700">2. Widget dashboard</text>
  <text x="465" y="140" text-anchor="middle" fill="#e2e8f0" font-size="11">Prompt affiche (si defini)</text>
  <text x="465" y="162" text-anchor="middle" fill="#e2e8f0" font-size="11">Boutons :</text>

  <!-- Oui button -->
  <rect x="390" y="172" width="70" height="28" rx="5" fill="#4ade80" opacity="0.15" stroke="#4ade80" stroke-width="1"/>
  <text x="425" y="191" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">Oui</text>
  <!-- Non button -->
  <rect x="475" y="172" width="70" height="28" rx="5" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="1"/>
  <text x="510" y="191" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">Non</text>

  <!-- Arrow 2→3 (Oui) -->
  <path d="M 425 230 L 425 260 L 300 260 L 300 300" stroke="#4ade80" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <text x="360" y="255" fill="#4ade80" font-size="10" font-weight="600">clic Oui</text>

  <!-- Arrow 2→3 (Non) -->
  <path d="M 510 230 L 510 260 L 620 260 L 620 300" stroke="#f87171" stroke-width="2" fill="none" marker-end="url(#aw)"/>
  <text x="565" y="255" fill="#f87171" font-size="10" font-weight="600">clic Non</text>

  <!-- API call -->
  <rect x="345" y="240" width="240" height="25" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="465" y="257" text-anchor="middle" fill="#64748b" font-size="9">POST /api/validate-check → DuckDB</text>

  <!-- State 3a: Validated PASS -->
  <rect x="140" y="305" width="280" height="120" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <rect x="140" y="305" width="280" height="30" rx="10" fill="#4ade80" opacity="0.15"/>
  <rect x="140" y="327" width="280" height="8" fill="#1e293b"/>
  <text x="280" y="327" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">3a. Valide PASS</text>
  <circle cx="157" cy="355" r="8" fill="#4ade80" opacity="0.6"/>
  <rect x="172" y="345" width="165" height="24" rx="4" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1"/>
  <text x="254" y="362" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Validation manuelle</text>
  <rect x="345" y="345" width="60" height="24" rx="4" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="375" y="362" text-anchor="middle" fill="#64748b" font-size="9">Modifier</text>
  <text x="280" y="400" text-anchor="middle" fill="#64748b" font-size="10">DuckDB : manual_validations</text>
  <text x="280" y="415" text-anchor="middle" fill="#64748b" font-size="9">Survit aux rechargements + nouveaux runs</text>

  <!-- State 3b: Validated FAIL -->
  <rect x="490" y="305" width="280" height="120" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  <rect x="490" y="305" width="280" height="30" rx="10" fill="#f87171" opacity="0.15"/>
  <rect x="490" y="327" width="280" height="8" fill="#1e293b"/>
  <text x="630" y="327" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">3b. Valide FAIL</text>
  <circle cx="507" cy="355" r="8" fill="#f87171" opacity="0.6"/>
  <rect x="522" y="345" width="165" height="24" rx="4" fill="#f87171" opacity="0.15" stroke="#f87171" stroke-width="1"/>
  <text x="604" y="362" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">Validation manuelle</text>
  <rect x="695" y="345" width="60" height="24" rx="4" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="725" y="362" text-anchor="middle" fill="#64748b" font-size="9">Modifier</text>
  <text x="630" y="400" text-anchor="middle" fill="#64748b" font-size="10">DuckDB : manual_validations</text>
  <text x="630" y="415" text-anchor="middle" fill="#64748b" font-size="9">status=fail, validated_by=dashboard</text>

  <!-- Arrow Modifier → back to widget -->
  <path d="M 375 370 L 375 460 L 465 460 L 465 230" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#aw)"/>
  <text x="420" y="475" text-anchor="middle" fill="#64748b" font-size="9">clic Modifier → re-affiche Oui/Non</text>

  <path d="M 725 370 L 725 460 L 465 460" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="5,3"/>
</svg>
