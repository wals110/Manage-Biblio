<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#0f172a" rx="12"/>
  <text x="500" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Flux de donnees — data.py</text>
  <text x="500" y="55" text-anchor="middle" fill="#64748b" font-size="12">Comment le dashboard fusionne 4 sources pour construire chaque page</text>

  <!-- Sources -->
  <text x="80" y="90" fill="#64748b" font-size="13" font-weight="700">SOURCES</text>

  <!-- tests.yaml -->
  <rect x="40" y="110" width="200" height="70" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="140" y="135" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">tests.yaml</text>
  <text x="140" y="155" text-anchor="middle" fill="#e2e8f0" font-size="10">Phases, series, checks</text>
  <text x="140" y="170" text-anchor="middle" fill="#64748b" font-size="9">variables, dependances, mode</text>

  <!-- report.json -->
  <rect x="40" y="200" width="200" height="70" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <text x="140" y="225" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="700">report.json</text>
  <text x="140" y="245" text-anchor="middle" fill="#e2e8f0" font-size="10">Resultats du dernier run</text>
  <text x="140" y="260" text-anchor="middle" fill="#64748b" font-size="9">status, output, duration, logs</text>

  <!-- DuckDB -->
  <rect x="40" y="290" width="200" height="70" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="140" y="315" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700">DuckDB</text>
  <text x="140" y="335" text-anchor="middle" fill="#e2e8f0" font-size="10">Historique tous les runs</text>
  <text x="140" y="350" text-anchor="middle" fill="#64748b" font-size="9">manual_validations, labels, git</text>

  <!-- CSV -->
  <rect x="40" y="380" width="200" height="70" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="140" y="405" text-anchor="middle" fill="#f87171" font-size="13" font-weight="700">CSV (logs/)</text>
  <text x="140" y="425" text-anchor="middle" fill="#e2e8f0" font-size="10">rapport_classify, rapport_rename</text>
  <text x="140" y="440" text-anchor="middle" fill="#64748b" font-size="9">Metriques detaillees fichier par fichier</text>

  <!-- data.py central -->
  <rect x="330" y="150" width="280" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="330" y="150" width="280" height="35" rx="10" fill="#38bdf8" opacity="0.15"/>
  <rect x="330" y="177" width="280" height="8" fill="#1e293b"/>
  <text x="470" y="173" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">data.py (27 fonctions)</text>

  <text x="350" y="205" fill="#a78bfa" font-size="11" font-weight="600">get_tests_yaml()</text>
  <text x="350" y="225" fill="#4ade80" font-size="11" font-weight="600">get_all_reports()</text>
  <text x="350" y="245" fill="#fbbf24" font-size="11" font-weight="600">get_run_from_db()</text>
  <text x="350" y="265" fill="#fbbf24" font-size="11" font-weight="600">get_available_runs()</text>

  <line x1="345" y1="278" x2="595" y2="278" stroke="#334155" stroke-width="1"/>

  <text x="350" y="298" fill="#38bdf8" font-size="11" font-weight="700">Fusion :</text>
  <text x="350" y="316" fill="#e2e8f0" font-size="10">get_merged_test_view()</text>
  <text x="360" y="332" fill="#64748b" font-size="9">= yaml + ALL JSON reports</text>
  <text x="350" y="350" fill="#e2e8f0" font-size="10">apply_db_statuses()</text>
  <text x="360" y="366" fill="#64748b" font-size="9">= merged + DuckDB validations</text>
  <text x="350" y="384" fill="#e2e8f0" font-size="10">_resolve_variables()</text>
  <text x="360" y="400" fill="#64748b" font-size="9">= ${VAR} → valeurs reelles</text>

  <line x1="345" y1="410" x2="595" y2="410" stroke="#334155" stroke-width="1"/>

  <text x="350" y="425" fill="#f87171" font-size="11" font-weight="600">compute_*_metrics() [DuckDB SQL]</text>

  <!-- Arrows sources → data.py -->
  <line x1="240" y1="145" x2="328" y2="195" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="235" x2="328" y2="225" stroke="#4ade80" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="325" x2="328" y2="265" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="415" x2="328" y2="420" stroke="#f87171" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Pages -->
  <text x="720" y="90" fill="#64748b" font-size="13" font-weight="700">PAGES</text>

  <!-- Overview -->
  <rect x="700" y="110" width="260" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="830" y="133" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">Overview</text>
  <text x="830" y="152" text-anchor="middle" fill="#64748b" font-size="9">merged view + llm_config + issues</text>

  <!-- Tests -->
  <rect x="700" y="180" width="260" height="55" rx="8" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="830" y="203" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">Tests</text>
  <text x="830" y="222" text-anchor="middle" fill="#64748b" font-size="9">merged view + db statuses + real-time</text>

  <!-- Rapports -->
  <rect x="700" y="250" width="260" height="55" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
  <text x="830" y="273" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">Rapports</text>
  <text x="830" y="292" text-anchor="middle" fill="#64748b" font-size="9">load_csv() + compute_csv_stats()</text>

  <!-- Comparer -->
  <rect x="700" y="320" width="260" height="55" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1"/>
  <text x="830" y="343" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">Comparer</text>
  <text x="830" y="362" text-anchor="middle" fill="#64748b" font-size="9">compare_runs() check-by-check</text>

  <!-- Metriques -->
  <rect x="700" y="390" width="260" height="55" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1"/>
  <text x="830" y="413" text-anchor="middle" fill="#f87171" font-size="12" font-weight="600">Metriques</text>
  <text x="830" y="432" text-anchor="middle" fill="#64748b" font-size="9">DuckDB read_csv_auto() + Chart.js</text>

  <!-- Admin -->
  <rect x="700" y="460" width="260" height="55" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
  <text x="830" y="483" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">Admin</text>
  <text x="830" y="502" text-anchor="middle" fill="#64748b" font-size="9">stats + runs list + API keys (.env)</text>

  <!-- Arrows data.py → pages -->
  <line x1="610" y1="195" x2="698" y2="137" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>
  <line x1="610" y1="225" x2="698" y2="207" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>
  <line x1="610" y1="280" x2="698" y2="277" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>
  <line x1="610" y1="310" x2="698" y2="347" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>
  <line x1="610" y1="420" x2="698" y2="417" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>
  <line x1="610" y1="430" x2="698" y2="487" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#ar-b)"/>

  <!-- Legend -->
  <rect x="40" y="530" width="920" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="555" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">Priorite de fusion — get_merged_test_view()</text>

  <text x="70" y="585" fill="#e2e8f0" font-size="11">1. Charger tests.yaml (structure de reference : phases, series, checks, mode, prompt)</text>
  <text x="70" y="605" fill="#e2e8f0" font-size="11">2. Pour chaque serie, prendre le MEILLEUR resultat de TOUS les rapports JSON (pass > fail > skip > not_run)</text>
  <text x="70" y="625" fill="#e2e8f0" font-size="11">3. Enrichir avec setup/pre_run/description depuis le YAML</text>
  <text x="70" y="645" fill="#e2e8f0" font-size="11">4. Resoudre les variables ${VAR} dans les commandes</text>
  <text x="70" y="665" fill="#e2e8f0" font-size="11">5. apply_db_statuses() : ecraser les statuts des checks valides manuellement depuis DuckDB</text>
</svg>
