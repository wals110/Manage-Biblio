<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 140" font-family="Segoe Print, Comic Sans MS, cursive" font-size="14">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- Box 1: PDFs en vrac -->
    <rect x="10" y="30" width="150" height="70" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="85" y="62" text-anchor="middle" font-size="22">📄</text>
    <text x="85" y="82" text-anchor="middle" font-size="11" fill="#92400e">PDFs en vrac</text>

    <!-- Arrow 1 -->
    <line x1="165" y1="65" x2="195" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 2: Renommage -->
    <rect x="200" y="30" width="150" height="70" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="275" y="62" text-anchor="middle" font-size="22">✏️</text>
    <text x="275" y="82" text-anchor="middle" font-size="11" fill="#1e40af">Renommage</text>

    <!-- Arrow 2 -->
    <line x1="355" y1="65" x2="385" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 3: LLM Vision + Classification -->
    <rect x="390" y="30" width="150" height="70" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="465" y="56" text-anchor="middle" font-size="22">🤖</text>
    <text x="465" y="74" text-anchor="middle" font-size="11" fill="#5b21b6">LLM Vision</text>
    <text x="465" y="88" text-anchor="middle" font-size="11" fill="#5b21b6">+ Classification</text>

    <!-- Arrow 3 -->
    <line x1="545" y1="65" x2="575" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 4: Copie -->
    <rect x="580" y="30" width="150" height="70" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="655" y="62" text-anchor="middle" font-size="22">📂</text>
    <text x="655" y="82" text-anchor="middle" font-size="11" fill="#3730a3">Copie</text>

    <!-- Arrow 4 -->
    <line x1="735" y1="65" x2="765" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 5: Raffinement -->
    <rect x="770" y="30" width="150" height="70" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="845" y="62" text-anchor="middle" font-size="22">🔍</text>
    <text x="845" y="82" text-anchor="middle" font-size="11" fill="#9d174d">Raffinement</text>

    <!-- Arrow 5 -->
    <line x1="925" y1="65" x2="955" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 6: Bibliothèque organisée -->
    <rect x="960" y="30" width="150" height="70" rx="12" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="1035" y="56" text-anchor="middle" font-size="22">📚</text>
    <text x="1035" y="74" text-anchor="middle" font-size="12" fill="#166534">Bibliothèque</text>
    <text x="1035" y="88" text-anchor="middle" font-size="12" fill="#166534">organisée</text>
  </g>

  <!-- Label bottom -->
  <text x="560" y="130" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">process = rename → classify → copie → refine</text>
</svg>
