<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 140" font-family="Segoe Print, Comic Sans MS, cursive" font-size="14">
  <defs>
    <filter id="h" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <g filter="url(#h)">
    <!-- Box 1: PDFs en vrac -->
    <rect x="10" y="35" width="130" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="75" y="68" text-anchor="middle" font-size="22">📄</text>
    <text x="75" y="86" text-anchor="middle" font-size="11" fill="#92400e">PDFs en vrac</text>

    <!-- Arrow 1 -->
    <line x1="145" y1="65" x2="180" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 2: Renommage -->
    <rect x="185" y="35" width="125" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="247" y="68" text-anchor="middle" font-size="22">✏️</text>
    <text x="247" y="86" text-anchor="middle" font-size="11" fill="#1e40af">Renommage</text>

    <!-- Arrow 2 -->
    <line x1="315" y1="65" x2="350" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 3: LLM Vision + Classification -->
    <rect x="355" y="25" width="175" height="80" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="442" y="56" text-anchor="middle" font-size="22">🤖</text>
    <text x="442" y="76" text-anchor="middle" font-size="11" fill="#5b21b6">LLM Vision</text>
    <text x="442" y="92" text-anchor="middle" font-size="11" fill="#5b21b6">+ Classification</text>

    <!-- Arrow 3 -->
    <line x1="535" y1="65" x2="570" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 4: Copie -->
    <rect x="575" y="35" width="105" height="60" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="627" y="68" text-anchor="middle" font-size="22">📂</text>
    <text x="627" y="86" text-anchor="middle" font-size="11" fill="#3730a3">Copie</text>

    <!-- Arrow 4 -->
    <line x1="685" y1="65" x2="720" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 5: Raffinement -->
    <rect x="725" y="35" width="125" height="60" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="787" y="68" text-anchor="middle" font-size="22">🔍</text>
    <text x="787" y="86" text-anchor="middle" font-size="11" fill="#9d174d">Raffinement</text>

    <!-- Arrow 5 -->
    <line x1="855" y1="65" x2="890" y2="65" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Box 6: Bibliothèque organisée -->
    <rect x="895" y="25" width="200" height="80" rx="14" fill="#d1fae5" stroke="#22c55e" stroke-width="2.5"/>
    <text x="995" y="56" text-anchor="middle" font-size="24">📚</text>
    <text x="995" y="78" text-anchor="middle" font-size="12" fill="#166534">Bibliothèque</text>
    <text x="995" y="94" text-anchor="middle" font-size="12" fill="#166534">organisée</text>
  </g>

  <!-- Label bottom -->
  <text x="560" y="132" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">process = rename → classify → copie → refine</text>
</svg>