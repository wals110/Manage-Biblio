<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="a-b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="a-g" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="900" height="550" fill="#0f172a" rx="12"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">Monitoring temps reel</text>
  <text x="450" y="55" text-anchor="middle" fill="#64748b" font-size="12">Dashboard ↔ Runner via stdout pipe + polling HTTP</text>

  <!-- Dashboard box -->
  <rect x="40" y="80" width="350" height="420" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="40" y="80" width="350" height="35" rx="10" fill="#38bdf8" opacity="0.15"/>
  <rect x="40" y="107" width="350" height="8" fill="#1e293b"/>
  <text x="215" y="103" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="700">Dashboard (FastAPI)</text>

  <!-- POST /api/run -->
  <rect x="65" y="130" width="300" height="35" rx="6" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
  <text x="215" y="152" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="600">POST /api/run → subprocess.Popen</text>

  <!-- Monitor thread -->
  <rect x="65" y="180" width="300" height="100" rx="6" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="215" y="200" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">_monitor_output() [daemon thread]</text>
  <text x="215" y="220" text-anchor="middle" fill="#e2e8f0" font-size="10">Lit stdout ligne par ligne</text>
  <text x="85" y="242" fill="#64748b" font-size="9">Regex: (T\d+\.\d+)        → serie courante</text>
  <text x="85" y="256" fill="#64748b" font-size="9">Regex: [T0.1a].*PASS      → check OK</text>
  <text x="85" y="270" fill="#64748b" font-size="9">Regex: └.*T0.1.*PASS      → serie finie</text>

  <!-- Global state -->
  <rect x="65" y="295" width="300" height="80" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="215" y="315" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="700">Etat global (memoire)</text>
  <text x="85" y="335" fill="#e2e8f0" font-size="10">_current_series = "T1.2"</text>
  <text x="85" y="350" fill="#e2e8f0" font-size="10">_completed_series = {T1.1: "pass"}</text>
  <text x="85" y="365" fill="#e2e8f0" font-size="10">_completed_checks = {T1.1a: "pass", ...}</text>

  <!-- GET /api/status -->
  <rect x="65" y="390" width="300" height="45" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="215" y="410" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="600">GET /api/status → JSON</text>
  <text x="215" y="425" text-anchor="middle" fill="#64748b" font-size="9">{running, current_series, completed, checks}</text>

  <!-- POST /api/stop -->
  <rect x="65" y="445" width="300" height="35" rx="6" fill="#0f172a" stroke="#f87171" stroke-width="1"/>
  <text x="215" y="467" text-anchor="middle" fill="#f87171" font-size="11" font-weight="600">POST /api/stop → terminate()</text>

  <!-- Runner box -->
  <rect x="510" y="80" width="350" height="250" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="510" y="80" width="350" height="35" rx="10" fill="#4ade80" opacity="0.15"/>
  <rect x="510" y="107" width="350" height="8" fill="#1e293b"/>
  <text x="685" y="103" text-anchor="middle" fill="#4ade80" font-size="14" font-weight="700">Subprocess (runner)</text>

  <text x="535" y="135" fill="#64748b" font-size="10">env: PYTHONUNBUFFERED=1</text>
  <text x="535" y="155" fill="#e2e8f0" font-size="11" font-weight="600">stdout (pipe) :</text>

  <rect x="535" y="165" width="300" height="130" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="545" y="183" fill="#4ade80" font-size="10" font-family="monospace">Phase 0 — Prerequis</text>
  <text x="545" y="198" fill="#e2e8f0" font-size="10" font-family="monospace">[T0.1] Environnement de test</text>
  <text x="545" y="213" fill="#4ade80" font-size="10" font-family="monospace">  [T0.1a] SSD monte      PASS</text>
  <text x="545" y="228" fill="#4ade80" font-size="10" font-family="monospace">  [T0.1b] _INBOX existe   PASS</text>
  <text x="545" y="243" fill="#4ade80" font-size="10" font-family="monospace">  └─ T0.1: PASS (0.3s)</text>
  <text x="545" y="258" fill="#38bdf8" font-size="10" font-family="monospace">[T0.2] Outils CLI</text>
  <text x="545" y="273" fill="#4ade80" font-size="10" font-family="monospace">  [T0.2a] klodo.sh OK     PASS</text>
  <text x="545" y="288" fill="#f87171" font-size="10" font-family="monospace">  [T0.2b] API key set     FAIL</text>

  <!-- Browser box -->
  <rect x="510" y="355" width="350" height="145" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="510" y="355" width="350" height="35" rx="10" fill="#a78bfa" opacity="0.15"/>
  <rect x="510" y="382" width="350" height="8" fill="#1e293b"/>
  <text x="685" y="378" text-anchor="middle" fill="#a78bfa" font-size="14" font-weight="700">Navigateur (JavaScript)</text>

  <text x="535" y="405" fill="#e2e8f0" font-size="11">setInterval(poll, 2000)</text>
  <text x="535" y="425" fill="#64748b" font-size="10">fetch('/api/status')</text>
  <text x="535" y="445" fill="#64748b" font-size="10">→ Met a jour les dots (vert/rouge/bleu)</text>
  <text x="535" y="465" fill="#64748b" font-size="10">→ Surligne la serie en cours</text>
  <text x="535" y="485" fill="#64748b" font-size="10">→ Desactive polling quand running=false</text>

  <!-- Arrows -->
  <!-- Dashboard → Runner (start) -->
  <line x1="365" y1="147" x2="508" y2="147" stroke="#4ade80" stroke-width="2" marker-end="url(#a-g)"/>
  <text x="430" y="140" text-anchor="middle" fill="#4ade80" font-size="9">Popen()</text>

  <!-- Runner stdout → Monitor -->
  <line x1="510" y1="240" x2="410" y2="240" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="460" y="235" text-anchor="middle" fill="#64748b" font-size="9">stdout pipe</text>

  <!-- Monitor → State -->
  <line x1="215" y1="280" x2="215" y2="293" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- State → /api/status -->
  <line x1="215" y1="375" x2="215" y2="388" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#a-b)"/>

  <!-- Browser → /api/status -->
  <path d="M 510 430 L 430 430 L 430 412 L 367 412" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#a-b)"/>
  <text x="430" y="445" fill="#38bdf8" font-size="9">poll 2s</text>

  <!-- Stop -->
  <path d="M 510 470 L 420 470 L 420 462 L 367 462" stroke="#f87171" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <text x="430" y="478" fill="#f87171" font-size="9">stop</text>
</svg>
